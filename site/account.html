<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00802B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://qrzlsomuluglbslricaf.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>My account | RGBKart</title>
<link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&family=Hind+Siliguri:wght@400;600&display=swap">
<link rel="stylesheet" href="shop.css?v=24">
<link rel="stylesheet" href="order.css?v=5">
<style>
  /* My account: profile, quick links, saved addresses, recent orders, password */
  .acc { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .me { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #00802B, #F5C400); color: #fff; display: grid; place-items: center; font: 700 1.6rem var(--display); flex: none; }
  .me .who { flex: 1; min-width: 200px; display: grid; gap: 2px; }
  .me .who b { font: 600 1.3rem var(--display); overflow-wrap: anywhere; }
  .me .who span { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  .btn-sm { font: 600 .88rem var(--body); padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer; text-decoration: none; }
  .btn-sm:hover { background: var(--accent); color: var(--accent-fg); }
  .btn-sm.solid { background: var(--accent); color: var(--accent-fg); } .btn-sm.solid:hover { background: var(--accent-hover); }
  .btn-sm.bad { border-color: var(--danger); color: var(--danger); } .btn-sm.bad:hover { background: var(--danger); color: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-decoration: none; color: var(--fg); display: grid; gap: 4px; transition: transform .15s, box-shadow .15s; border-top: 4px solid var(--c, #00802B); }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgb(0 0 0 / .08); }
  .tile .ic { font-size: 1.5rem; } .tile b { font-size: 1rem; } .tile span { color: var(--muted); font-size: .84rem; }
  .tile:nth-child(2) { --c: #E30613; } .tile:nth-child(3) { --c: #F5C400; } .tile:nth-child(4) { --c: #2979FF; }
  .sec h2 { font: 600 1.15rem var(--display); margin: 0; }
  .sec-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .addrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .addr { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; background: var(--bg); }
  .addr.def { border-color: var(--accent); background: var(--accent-soft); }
  .addr .atop { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  .addr .lbl { font-weight: 700; } .addr .tag { font-size: .72rem; font-weight: 800; background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 2px 8px; }
  .addr p { margin: 0; font-size: .9rem; overflow-wrap: anywhere; } .addr .m { color: var(--muted); }
  .addr .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .addr .acts button { background: none; border: 0; padding: 2px 0; font: 600 .85rem var(--body); color: var(--accent); cursor: pointer; } .addr .acts button.bad { color: var(--danger); }
  .orow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .orow:first-child { border-top: 0; }
  .pw-row { position: relative; } .pw-row input { padding-right: 46px; }
  .pw-row .eye { position: absolute; right: 4px; bottom: 4px; width: 38px; height: 38px; border: 0; background: none; cursor: pointer; font-size: 1.1rem; }
</style>
</head>
<body>
<main class="wrap ord-main" style="max-width:1000px">
  <h1>My account</h1>
  <div id="content"><div class="box">Loading…</div></div>
</main>

<script src="session.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="i18n.js?v=35"></script>
<script src="sync.js?v=1"></script>
<script src="shop.js?v=30"></script>
<script src="menu.js?v=7"></script>
<script src="cartlib.js?v=4"></script>
<script>
  let me = null, prof = null, addrs = [], tableReady = true;
  const LABEL = { pending: 'Waiting for shop', confirmed: 'Confirmed', packed: 'Packed', shipped: 'On the way', delivered: 'Delivered', cancelled: 'Cancelled' };
  const PHONE_RE = { test: v => RGBPhone.ok(v) };   // phone.js: 01… / +8801… / 8801…

  async function start() {
    await initShell();
    const { data: { session } } = await db.auth.getSession();
    const box = $('content');
    if (!session || session.user.is_anonymous) {
      box.innerHTML = '';
      box.append(h('div', { class: 'box empty-cart' }, h('b', { text: 'Sign in to see your account' }),
        h('span', { text: 'Save your addresses, follow your orders and keep your wishlist in one place.' }),
        h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center' }, h('a', { class: 'btn-acc', href: 'login.html', text: 'Sign in' }), h('a', { class: 'btn-line', href: 'orders.html', text: 'My orders' }))));
      return;
    }
    me = session.user;
    const p = await db.from('profiles').select('*').eq('id', me.id).maybeSingle();
    prof = p.data || {};
    if (prof.role === 'seller') { location.replace('seller.html'); return; }
    draw();
  }

  async function draw() {
    const box = $('content'); box.innerHTML = '';
    const name = prof.full_name || me.email;
    const wish = store.get(WISH_KEY).length, cartN = store.get(CART_KEY).reduce((a, i) => a + i.qty, 0);
    const [o, m, al, ad] = await Promise.all([
      db.from('orders').select('id, order_no, status, total, created_at, seller_id', { count: 'exact' }).eq('customer_id', me.id).order('created_at', { ascending: false }).limit(3),
      db.rpc('my_unread_count'), db.rpc('my_alert_count'),
      db.from('customer_addresses').select('*').order('is_default', { ascending: false }).order('updated_at', { ascending: false })]);
    tableReady = !ad.error; addrs = ad.data || [];

    // RGBKart staff see a shortcut to the admin dashboard (shown only when the account is on the team)
    const staffLink = h('a', { class: 'btn-sm solid', href: 'admin.html', text: '⚙ Admin dashboard', hidden: true, translate: 'no', style: 'text-decoration:none' });
    db.rpc('my_staff_role').then(r => { if (!r.error && r.data) staffLink.hidden = false; }, () => {});
    // profile
    const edit = h('form', { class: 'form', hidden: true, style: 'margin-top:12px', onsubmit: saveProfile },
      h('div', { class: 'two' },
        h('label', {}, T('Full name'), h('input', { id: 'pfName', type: 'text', maxlength: 80, value: prof.full_name || '', autocomplete: 'name' })),
        h('label', {}, T('Mobile number'), h('input', { id: 'pfPhone', type: 'tel', maxlength: 16, value: prof.phone || '', placeholder: '01XXXXXXXXX', autocomplete: 'tel' }))),
      h('p', { class: 'err', id: 'pfErr', hidden: true }),
      h('div', { style: 'display:flex;gap:8px' }, h('button', { type: 'submit', class: 'btn-sm solid', text: 'Save' }), h('button', { type: 'button', class: 'btn-sm', text: 'Cancel', onclick: () => edit.hidden = true })));
    box.append(h('section', { class: 'box' },
      h('div', { class: 'me' }, h('div', { class: 'avatar', 'aria-hidden': 'true', text: (name || '?').charAt(0).toUpperCase() }),
        h('div', { class: 'who' }, h('b', { text: name, translate: 'no' }), h('span', { text: me.email, translate: 'no' }), prof.phone && h('span', { text: prof.phone, translate: 'no' }),
          h('span', { text: T('Customer since {d}', { d: RGBLang.date(me.created_at, { month: 'long', year: 'numeric' }) }) })),
        h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
          staffLink,
          prof.role === 'seller' && h('a', { class: 'btn-sm', href: 'seller.html', text: T('Seller Center'), style: 'text-decoration:none' }),
          h('button', { type: 'button', class: 'btn-sm', text: 'Edit profile', onclick: () => { edit.hidden = !edit.hidden; } }),
          h('button', { type: 'button', class: 'btn-sm bad', text: 'Sign out', onclick: async () => { await db.auth.signOut(); location.href = 'index.html'; } }))),
      edit));

    // quick links
    box.append(h('section', { class: 'tiles' },
      h('a', { class: 'tile', href: 'orders.html' }, h('span', { class: 'ic', 'aria-hidden': 'true', text: '📦' }), h('b', { text: 'My orders' }), h('span', { text: T(o.count === 1 ? '{n} order' : '{n} orders', { n: o.count || 0 }) })),
      h('a', { class: 'tile', href: 'browse.html?wishlist=1' }, h('span', { class: 'ic', 'aria-hidden': 'true', text: '♥' }), h('b', { text: 'Saved items' }), h('span', { text: T(wish === 1 ? '{n} item' : '{n} items', { n: wish }) })),
      h('a', { class: 'tile', href: 'messages.html' }, h('span', { class: 'ic', 'aria-hidden': 'true', text: '💬' }), h('b', { text: 'Messages' }), h('span', { text: T('{n} new', { n: (m && m.data) || 0 }) })),
      h('a', { class: 'tile', href: 'alerts.html' }, h('span', { class: 'ic', 'aria-hidden': 'true', text: '🔔' }), h('b', { text: 'Alerts' }), h('span', { text: T('{n} new', { n: (al && al.data) || 0 }) }))));

    // addresses
    const addrBox = h('section', { class: 'box sec', id: 'addrSec' });
    box.append(addrBox); drawAddrs();

    // recent orders
    const orders = o.data || [];
    box.append(h('section', { class: 'box sec' },
      h('div', { class: 'sec-top' }, h('h2', { text: 'Recent orders' }), h('a', { class: 'btn-sm', href: 'orders.html', text: 'See all orders →' })),
      orders.length ? h('div', {}, orders.map(x => h('div', { class: 'orow' },
          h('div', {}, h('div', { class: 'ono', text: x.order_no }), h('div', { class: 'm', text: RGBLang.date(x.created_at, { day: 'numeric', month: 'short', year: 'numeric' }) })),
          h('span', { class: 'ost ' + x.status, text: T(LABEL[x.status] || x.status) }), h('b', { text: money(x.total) }))))
        : h('p', { class: 'm', text: 'No orders yet. When you place an order, you can track it here.' }),
      cartN > 0 && h('p', { class: 'm', style: 'margin-top:10px' }, T(cartN === 1 ? 'You have {n} item in your cart.' : 'You have {n} items in your cart.', { n: cartN }) + ' ', h('a', { href: 'cart.html', text: 'Go to cart →' }))));

    // promotional emails (0059_email_offers.sql): only shown once the switch exists
    if ('email_offers' in prof) {
      const cb = h('input', { type: 'checkbox', checked: !!prof.email_offers, style: 'width:20px;height:20px;flex:none' });
      cb.onchange = async () => {
        const r = await db.rpc('set_email_offers', { p_on: cb.checked });
        if (r.error) { cb.checked = !cb.checked; return toast(T('Could not save. Please try again.')); }
        toast(cb.checked ? T('You will get offers by email.') : T('No more offer emails.'));
      };
      box.append(h('section', { class: 'box sec' }, h('h2', { text: 'Emails' }),
        h('label', { style: 'display:flex;gap:10px;align-items:flex-start;cursor:pointer' }, cb,
          h('span', {}, h('b', { text: 'Send me offers, discounts and RGBKart news by email' }), h('br'),
            h('span', { class: 'm', text: 'Order and account emails are always sent.' })))));
    }

    // password (email accounts only)
    if ((me.app_metadata && me.app_metadata.provider) === 'email' || !me.app_metadata || !me.app_metadata.provider) {
      const pw = (id, label) => h('label', { class: 'pw-row' }, label, h('input', { id, type: 'password', minlength: 8, autocomplete: 'new-password' }),
        h('button', { type: 'button', class: 'eye', 'aria-label': 'Show password', text: '👁', onclick: e => { const i = $(id); i.type = i.type === 'password' ? 'text' : 'password'; e.target.setAttribute('aria-label', i.type === 'password' ? 'Show password' : 'Hide password'); } }));
      const f = h('form', { class: 'form', hidden: true, onsubmit: changePw }, h('div', { class: 'two' }, pw('npw1', T('New password')), pw('npw2', T('Confirm new password'))),
        h('p', { class: 'err', id: 'pwErr', hidden: true }), h('div', {}, h('button', { type: 'submit', class: 'btn-sm solid', text: 'Save password' })));
      box.append(h('section', { class: 'box sec' }, h('div', { class: 'sec-top', style: 'margin:0' }, h('h2', { text: 'Password' }), h('button', { type: 'button', class: 'btn-sm', text: 'Change password', onclick: () => { f.hidden = !f.hidden; } })), f));
    }
  }

  function drawAddrs(editing) {
    const sec = $('addrSec'); sec.innerHTML = '';
    sec.append(h('div', { class: 'sec-top' }, h('h2', { text: 'Saved addresses' }),
      tableReady && addrs.length < 10 && h('button', { type: 'button', class: 'btn-sm solid', text: '+ Add address', onclick: () => drawAddrs({}) })));
    if (!tableReady) { sec.append(h('p', { class: 'm', text: 'Saved addresses aren\'t switched on yet.' })); return; }
    if (editing) sec.append(addrForm(editing));
    if (!addrs.length && !editing) sec.append(h('p', { class: 'm', text: 'No saved addresses yet. Add one, or tick "Save this address" at checkout.' }));
    sec.append(h('div', { class: 'addrs' }, addrs.map(a => h('div', { class: 'addr' + (a.is_default ? ' def' : '') },
      h('div', { class: 'atop' }, h('span', { class: 'lbl', text: a.label || T('Address') }), a.is_default && h('span', { class: 'tag', text: T('Default') })),
      h('p', { text: a.full_name + (a.phone ? ' · ' + a.phone : ''), translate: 'no' }),
      h('p', { class: 'm', translate: 'no', text: [a.address, a.area, RGBLang.tr(a.district)].filter(Boolean).join(', ') }),
      h('div', { class: 'acts' },
        h('button', { type: 'button', text: 'Edit', onclick: () => drawAddrs(a) }),
        !a.is_default && h('button', { type: 'button', text: 'Make default', onclick: async () => { const r = await db.from('customer_addresses').update({ is_default: true }).eq('id', a.id); if (r.error) return toast(r.error.message); reloadAddrs(); } }),
        h('button', { type: 'button', class: 'bad', text: 'Delete', onclick: async e => {
          if (e.target.dataset.sure !== '1') { e.target.dataset.sure = '1'; e.target.textContent = T('Tap again to delete'); return; }
          const r = await db.from('customer_addresses').delete().eq('id', a.id); if (r.error) return toast(r.error.message); toast(T('Deleted')); reloadAddrs(); } }))))));
  }

  function addrForm(a) {
    const dist = h('select', { id: 'adDist' }, h('option', { value: '', text: T('Choose your district') }), DISTRICTS_BD.map(d => h('option', { value: d, text: d, selected: a.district === d })));
    const err = h('p', { class: 'err', hidden: true });
    const f = h('form', { class: 'form', style: 'margin-bottom:14px;padding:14px;border:1.5px solid var(--accent);border-radius:12px;background:var(--accent-soft)', onsubmit: async e => {
      e.preventDefault();
      const v = { label: $('adLabel').value.trim() || null, full_name: $('adName').value.trim(), phone: RGBPhone.clean($('adPhone').value) || null,
        address: $('adAddr').value.trim(), district: dist.value, area: $('adArea').value.trim() || null, is_default: $('adDef').checked };
      const bad = [];
      if (v.full_name.length < 2) bad.push(T('your name'));
      if (v.phone && !PHONE_RE.test(v.phone)) bad.push(T('a valid mobile number like 01711000000'));
      if (v.address.length < 5) bad.push(T('your full address'));
      if (!v.district) bad.push(T('your district'));
      if (bad.length) { err.textContent = T('Please enter {x}.', { x: bad.join(', ') }); err.hidden = false; return; }
      const r = a.id ? await db.from('customer_addresses').update(v).eq('id', a.id) : await db.from('customer_addresses').insert(v);
      if (r.error) { err.textContent = r.error.message; err.hidden = false; return; }
      toast(T('Address saved')); reloadAddrs();
    } },
      h('div', { class: 'two' },
        h('label', {}, T('Label (e.g. Home, Office)'), h('input', { id: 'adLabel', type: 'text', maxlength: 30, value: a.label || '', placeholder: T('Home') })),
        h('label', {}, h('span', { class: 'req', text: T('Full name') }), h('input', { id: 'adName', type: 'text', maxlength: 80, value: a.full_name || prof.full_name || '' }))),
      h('div', { class: 'two' },
        h('label', {}, T('Mobile number'), h('input', { id: 'adPhone', type: 'tel', maxlength: 16, placeholder: '01XXXXXXXXX', value: a.phone || prof.phone || '' })),
        h('label', {}, h('span', { class: 'req', text: T('District') }), dist)),
      h('label', {}, h('span', { class: 'req', text: T('Address (house, road, area)') }), h('input', { id: 'adAddr', type: 'text', maxlength: 300, value: a.address || '', placeholder: T('e.g. House 12, Road 5, Block C, Mirpur 10') })),
      h('label', {}, T('Area / thana (optional)'), h('input', { id: 'adArea', type: 'text', maxlength: 60, value: a.area || '' })),
      h('label', { class: 'save-addr' }, h('input', { id: 'adDef', type: 'checkbox', checked: a.is_default || !addrs.length }), T('Use as my default address')),
      err, h('div', { style: 'display:flex;gap:8px' }, h('button', { type: 'submit', class: 'btn-sm solid', text: 'Save address' }), h('button', { type: 'button', class: 'btn-sm', text: 'Cancel', onclick: () => drawAddrs() })));
    return f;
  }
  async function reloadAddrs() {
    const r = await db.from('customer_addresses').select('*').order('is_default', { ascending: false }).order('updated_at', { ascending: false });
    addrs = r.data || []; drawAddrs();
  }

  async function saveProfile(e) {
    e.preventDefault();
    const name = $('pfName').value.trim(), phone = RGBPhone.clean($('pfPhone').value);
    const err = $('pfErr');
    if (name.length < 2 || (phone && !PHONE_RE.test(phone))) { err.textContent = T('Please enter {x}.', { x: name.length < 2 ? T('your name') : T('a valid mobile number like 01711000000') }); err.hidden = false; return; }
    const r = await db.from('profiles').update({ full_name: name, phone: phone || null }).eq('id', me.id);
    if (r.error) { err.textContent = r.error.message; err.hidden = false; return; }
    prof.full_name = name; prof.phone = phone || null; toast(T('Saved')); draw();
  }
  async function changePw(e) {
    e.preventDefault();
    const a = $('npw1').value, b = $('npw2').value, err = $('pwErr');
    if (a.length < 8) { err.textContent = T('Use at least 8 characters for the password.'); err.hidden = false; return; }
    if (a !== b) { err.textContent = T("The two passwords don't match. Type the same password in both boxes."); err.hidden = false; return; }
    const { error } = await db.auth.updateUser({ password: a });
    if (error) { err.textContent = error.message; err.hidden = false; return; }
    toast(T('Password changed')); e.target.hidden = true; e.target.reset(); err.hidden = true;
  }
  start();
</script>
</body>
</html>
