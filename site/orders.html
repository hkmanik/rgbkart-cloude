<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00802B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://qrzlsomuluglbslricaf.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>My orders | RGBKart</title>
<link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&family=Hind+Siliguri:wght@400;600&display=swap">
<link rel="stylesheet" href="shop.css?v=15">
<link rel="stylesheet" href="order.css?v=3">
<style>
  .rate { margin-top: 10px; }
  .rate:empty { display: none; }
  .rate-ask, .rate-done { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; background: #FFF8D6; border: 1px solid #F5C400; border-radius: 10px; padding: 10px 14px; }
  .rate-done { background: var(--bg); border-color: var(--line); }
  .rate-done .stars { font-size: 1.05rem; vertical-align: -2px; }
  .rate-form { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; background: var(--bg); }
  .rate-form h3 { margin: 0; font-size: 1.05rem; }
  .rate-item { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .rate-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .rate-h b { overflow-wrap: anywhere; }
  .rate-item textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); resize: vertical; width: 100%; box-sizing: border-box; }
  .oact .btn-acc { background: var(--accent); color: var(--accent-fg, #fff); border-color: var(--accent); }
  .ret-bit { display: grid; gap: 2px; justify-items: start; margin-top: 4px; }
  .ret-st { font-size: .82rem; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--bg); border: 1px solid var(--line); }
  .ret-st.requested { background: #FFF6CC; border-color: #F5C400; color: #6B5300; } .ret-st.approved, .ret-st.received { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .ret-st.rejected { background: #FDE7E8; border-color: #F3A6AB; color: #8F000A; }
  .ret-holder:empty { display: none; } .ret-holder { margin-top: 10px; }
  .ret-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ret-grid label, .ret-l { display: grid; gap: 4px; font-size: .88rem; font-weight: 600; }
  .rate-form select, .rate-form input[type=file] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); max-width: 100%; }
  .rate-form textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); resize: vertical; width: 100%; box-sizing: border-box; }
  .linkbtn { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 4px 0; text-decoration: underline; }
  @media (prefers-color-scheme: dark) { .rate-ask { background: #3a3210; } }
</style>
</head>
<body>

<main class="wrap ord-main" style="max-width:900px">
  <h1>My orders</h1>
  <p class="lead">Track your orders. Each shop confirms, packs and delivers its own order, and you pay it in cash on delivery.</p>
  <div id="content"><div class="box">Loading…</div></div>
</main>

<script src="session.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="i18n.js?v=24"></script>
<script src="sync.js?v=1"></script>
<script src="shop.js?v=18"></script>
<script src="menu.js?v=5"></script>
<script src="report.js?v=1"></script>
<script>
  const STEPS = [['pending', 'Placed'], ['confirmed', 'Confirmed'], ['packed', 'Packed'], ['shipped', 'On the way'], ['delivered', 'Delivered']];
  const LABEL = { pending: 'Waiting for shop', confirmed: 'Confirmed', packed: 'Packed', shipped: 'On the way', delivered: 'Delivered', cancelled: 'Cancelled' };
  const fmt = t => RGBLang.date(t, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  let cancelRules = { buyer_until: 'confirmed', need_reason: true };
  const CANCEL_WHY = ['Ordered by mistake', 'Found a better price', 'Delivery takes too long', 'Want to change the order', 'Other reason'];
  // cancel by myself, or ask the shop (after the step allowed by RGBKart)
  function cancelBits(o) {
    const idx = k => STEPS.findIndex(x => x[0] === k);
    const self = ['pending', 'confirmed', 'packed'].includes(o.status) && idx(o.status) <= idx(cancelRules.buyer_until);
    const canAsk = !self && !cancelRules.old && ['confirmed', 'packed', 'shipped'].includes(o.status) && o.cancel_request_status !== 'open';
    const why = h('select', { 'aria-label': T('Reason for cancelling'), style: 'font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)' },
      h('option', { value: '', text: T('Why do you want to cancel?') }), CANCEL_WHY.map(t => h('option', { value: t, text: T(t) })));
    const more = h('input', { type: 'text', maxlength: 200, placeholder: T('More details (optional)'), 'aria-label': T('More details'), style: 'flex:1;min-width:180px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)' });
    const row = h('div', { class: 'oact', hidden: true }, why, more,
      h('button', { type: 'button', class: 'bad', text: self ? T('Yes, cancel order') : T('Send request to the shop'), onclick: async e => {
        const txt = [why.value, more.value.trim()].filter(Boolean).join(': ');
        if (!why.value && (cancelRules.need_reason || !self)) { why.focus(); return toast(T('Please choose why you are cancelling')); }
        e.target.disabled = true;
        const { error } = self ? await db.rpc('update_order', { p_order: o.id, p_status: 'cancelled', p_note: txt || 'Cancelled by customer' })
                               : await db.rpc('request_cancel', { p_order: o.id, p_reason: txt });
        if (error) { e.target.disabled = false; return toast(T(error.message)); }
        toast(T(self ? 'Order cancelled' : 'Request sent. The shop will answer soon.')); load();
      } }),
      h('button', { type: 'button', text: T('Keep order'), onclick: () => row.hidden = true }));
    const open = () => { row.hidden = false; why.focus(); };
    const button = self ? h('button', { type: 'button', class: 'bad', text: T('Cancel order'), onclick: open })
                 : canAsk ? h('button', { type: 'button', class: 'bad', text: T('Ask the shop to cancel'), onclick: open }) : null;
    const state = o.status === 'cancelled' ? null
      : o.cancel_request_status === 'open' ? h('p', { class: 'm', style: 'background:#FFF6CC;color:#6B5300;padding:8px 10px;border-radius:8px' }, T('You asked the shop to cancel this order. Waiting for the shop\'s answer.'), h('br'), h('span', { translate: 'no', text: o.cancel_request || '' }))
      : o.cancel_request_status === 'declined' ? h('p', { class: 'm bad' }, T('The shop could not cancel this order:'), ' ', h('span', { translate: 'no', text: o.cancel_request_reply || '' })) : null;
    return { button, row, state };
  }
  async function load() {
    const box = $('content');
    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      box.innerHTML = '';
      box.append(h('div', { class: 'box empty-cart' }, h('b', { text: 'No orders on this device' }), h('span', { text: 'Sign in to see orders in your account, or place an order to see it here.' }),
        h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center' }, h('a', { class: 'btn-acc', href: 'login.html', text: 'Sign in' }), h('a', { class: 'btn-line', href: 'browse.html', text: 'Start shopping' }))));
      return;
    }
    const r = await db.from('orders').select('*, order_items(*)').eq('customer_id', session.user.id).order('created_at', { ascending: false }).limit(100);
    if (r.error) { box.innerHTML = ''; box.append(h('div', { class: 'box', text: /does not exist|Could not find/i.test(r.error.message) ? 'Orders aren\'t switched on yet.' : r.error.message })); return; }
    const orders = r.data;
    // cancellation rules set by RGBKart (0042): until which step buyers cancel themselves; after that they ask the shop
    const cr = await db.rpc('cancel_rules'); cancelRules = (!cr.error && cr.data) || { buyer_until: 'confirmed', need_reason: true, old: true };
    const sids = [...new Set(orders.map(o => o.seller_id))];
    const s = sids.length ? await db.from('shops').select('user_id, shop_name, shop_name_bn, shop_slug, phone_public, whatsapp, pickup_address').in('user_id', sids) : { data: [] };
    const shops = new Map((s.data || []).map(x => [x.user_id, x]));
    const done = orders.filter(o => o.status === 'delivered').map(o => o.id);
    const rv = done.length ? await db.from('reviews').select('*').in('order_id', done) : { data: [] };
    const myReviews = rv.data || [];
    const rr = done.length ? await db.from('return_requests').select('*').in('order_id', done).order('created_at', { ascending: false }) : { data: [] };
    myReturns = rr.error ? null : (rr.data || []);
    box.innerHTML = '';
    if (!orders.length) {
      box.append(h('div', { class: 'box empty-cart' }, h('b', { text: 'No orders yet' }), h('span', { text: 'When you place an order, you can track it here.' }), h('a', { class: 'btn-acc', href: 'browse.html', text: 'Start shopping' })));
      return;
    }
    const list = h('div', { class: 'olist' });
    for (const o of orders) {
      const retHolder = h('div', { class: 'ret-holder' });
      const shop = shops.get(o.seller_id) || {};
      const at = STEPS.findIndex(x => x[0] === o.status);
      const cx = cancelBits(o);
      list.append(h('article', { class: 'box ocard' },
        h('div', { class: 'ohead' }, h('div', {}, h('a', { href: 'store.html?s=' + encodeURIComponent(shop.shop_slug || o.seller_id), style: 'color:inherit;text-decoration:none' }, h('b', { text: L(shop, 'shop_name') || T('Shop'), translate: 'no' })), h('div', { class: 'm' }, h('span', { class: 'ono', text: o.order_no }), o.invoice_no ? ' · ' + T('Invoice {i}', { i: o.invoice_no }) : '', ' · ' + fmt(o.created_at))),
          h('span', { class: 'ost ' + o.status, text: LABEL[o.status] })),
        o.status !== 'cancelled' && h('div', { class: 'track', 'aria-label': 'Order progress' }, STEPS.map(([k, t], i) => h('span', { class: i <= at ? 'on' : '', text: t }))),
        o.status === 'cancelled' && h('p', { class: 'm bad', text: T(o.cancelled_by === 'customer' ? 'Cancelled by you' : o.cancelled_by === 'seller' ? 'Cancelled by the shop' : 'Cancelled') + (o.cancel_reason ? ': ' + o.cancel_reason : '') }),
        cx.state,
        o.tracking_note && o.status !== 'cancelled' && h('p', { class: 'm', text: T('Delivery info from the shop: ') + o.tracking_note }),
        h('div', { class: 'oitems' }, (o.order_items || []).map(i => h('div', { class: 'oitem' },
          i.image_path ? h('img', { src: imgUrl(i.image_path), alt: '', loading: 'lazy' }) : h('div', { class: 'noimg' }),
          h('div', { style: 'min-width:0' }, i.product_id ? h('a', { href: `product.html?id=${i.product_id}`, text: i.title, style: 'color:var(--fg);font-weight:600;text-decoration:none' }) : h('b', { text: i.title }),
            h('div', { class: 'm', text: `${N(i.qty)} × ${money(i.unit_price)}${i.variant_label ? ' · ' + i.variant_label : ''}` }),
            o.status === 'delivered' && returnBit(o, i, retHolder)),
          h('b', { text: money(i.line_total) })))),
        retHolder,
        h('div', { class: 'srow' }, h('span', { class: 'm', text: T('Delivery: {d} · to {w}', { d: T(({ dhaka: 'Inside Dhaka', outside: 'Outside Dhaka', pickup: 'Store pickup', negotiated: 'Agree with shop' })[o.ship_method] || o.ship_name || o.ship_method) + (o.ship_fee > 0 ? ' · ' + money(o.ship_fee) : ''), w: `${o.address}, ${RGBLang.tr(o.district)}` }) }), h('b', { text: T('Total {p}', { p: money(o.total) }) })),
        Number(o.discount) > 0 && h('p', { class: 'm', style: 'color:var(--accent);font-weight:600', text: T('Coupon {c}', { c: o.coupon_code || '' }) + ' −' + money(o.discount) }),
        Number(o.vat_amount) > 0 && h('p', { class: 'm', style: 'text-align:right', text: o.vat_rate != null ? T('Includes VAT {n}%: {p}', { n: Number(o.vat_rate), p: money(o.vat_amount) }) : T('Includes VAT: {p}', { p: money(o.vat_amount) }) }),
        o.ship_method === 'pickup' && shop.pickup_address && h('p', { class: 'm', text: T('Pick up from: ') + shop.pickup_address }),
        h('div', { class: 'oact' },
          shop.phone_public && h('a', { href: 'tel:' + shop.phone_public, text: '📞 Call shop' }),
          (shop.whatsapp || shop.phone_public) && h('a', { href: `https://wa.me/${((shop.whatsapp || shop.phone_public).replace(/[^0-9]/g, '').replace(/^0/, '880'))}?text=${encodeURIComponent(T('Hi, about my RGBKart order {o}', { o: o.order_no }))}`, target: '_blank', rel: 'noopener', text: T('WhatsApp') }),
          cx.button,
          window.RGBReport && h('span', { style: 'margin-left:auto' }, RGBReport.link(db, { shop: o.seller_id }))),
        cx.row,
        o.status === 'delivered' && rateBox(o, shop, myReviews.filter(r => r.order_id === o.id))));
    }
    box.append(list);
  }
  // ---------- Returns (0036_returns.sql) ----------
  let myReturns = null;
  const RET_REASONS = [['damaged', 'Arrived damaged or broken'], ['wrong_item', 'Wrong item or wrong size/colour sent'], ['not_as_described', 'Not as described or shown'],
    ['missing_parts', 'Parts or accessories missing'], ['size_fit', 'Size or fit is not right'], ['quality', 'Poor quality or not working'], ['changed_mind', 'Changed my mind'], ['other', 'Something else']];
  const RET_STATUS = { requested: 'Return requested: waiting for the shop', approved: 'Return accepted: the shop will contact you to collect it', rejected: 'Return declined by the shop',
    received: 'Return completed: the shop received the item', cancelled: 'Return request cancelled' };
  function returnBit(o, i, holder) {
    if (myReturns === null || !i.product_id) return null;
    const mine = myReturns.filter(r => r.order_item_id === i.id);
    const open = mine.find(r => ['requested', 'approved'].includes(r.status)) || mine[0];
    const days = Number(i.return_days || 0);
    const until = new Date(new Date(o.delivered_at || o.updated_at).getTime() + days * 864e5);
    const canAsk = days > 0 && until > new Date() && !mine.some(r => ['requested', 'approved'].includes(r.status));
    const wrap = h('div', { class: 'ret-bit' });
    if (open && open.status !== 'cancelled') {
      wrap.append(h('span', { class: 'ret-st ' + open.status, text: T(RET_STATUS[open.status]) }),
        open.seller_note && h('span', { class: 'm', text: T('Shop: ') + open.seller_note, translate: 'no' }),
        open.status === 'requested' && h('button', { type: 'button', class: 'linkbtn', text: T('Cancel return request'), onclick: async () => {
          const { error } = await db.rpc('cancel_return', { p_return: open.id }); if (error) return toast(T(error.message)); load(); } }));
    }
    if (canAsk && (!open || ['rejected', 'cancelled', 'received'].includes(open.status)))
      wrap.append(h('button', { type: 'button', class: 'linkbtn', text: T('↩ Return this item (until {d})', { d: RGBLang.date(until, { day: 'numeric', month: 'short' }) }), onclick: () => returnForm(o, i, holder) }));
    else if (!open && days === 0) wrap.append(h('span', { class: 'm', text: T('No returns for this item') }));
    return wrap.childNodes.length ? wrap : null;
  }
  function returnForm(o, i, holder) {
    const maxQ = i.qty - (myReturns || []).filter(r => r.order_item_id === i.id && r.status === 'received').reduce((a, r) => a + r.qty, 0);
    const qty = h('select', { 'aria-label': T('How many') }, Array.from({ length: Math.max(1, maxQ) }, (_, k) => h('option', { value: k + 1, text: N(k + 1) })));
    const reason = h('select', { 'aria-label': T('Reason') }, h('option', { value: '', text: T('Choose a reason…') }), RET_REASONS.map(([v, t]) => h('option', { value: v, text: T(t) })));
    const wants = h('select', { 'aria-label': T('What do you want?') }, h('option', { value: 'refund', text: T('Money back (refund)') }), h('option', { value: 'exchange', text: T('Exchange for another one') }));
    const details = h('textarea', { rows: 3, maxlength: 1000, placeholder: T('Tell the shop what is wrong (helps them decide quickly)'), 'aria-label': T('Details') });
    const files = h('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp', multiple: true, 'aria-label': T('Photos (up to 3)') });
    const err = h('p', { class: 'm bad', role: 'alert', hidden: true });
    const send = h('button', { type: 'button', class: 'btn-acc', text: T('Send return request') });
    send.onclick = async () => {
      err.hidden = true;
      if (!reason.value) { err.textContent = T('Please choose a reason.'); err.hidden = false; return; }
      if (reason.value === 'other' && !details.value.trim()) { err.textContent = T('Please tell the shop what is wrong'); err.hidden = false; return; }
      const fs = [...files.files].slice(0, 3);
      if (fs.some(f => f.size > 5 * 1024 * 1024)) { err.textContent = T('Each photo must be under 5 MB'); err.hidden = false; return; }
      send.disabled = true; send.textContent = T('Sending…');
      try {
        const { data: { session } } = await db.auth.getSession();
        const paths = [];
        for (const f of fs) {
          const ext = (f.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
          const path = `${session.user.id}/return-${o.id}-${Date.now()}-${paths.length}.${ext}`;
          const up = await db.storage.from('return-photos').upload(path, f, { contentType: f.type, upsert: false });
          if (up.error) throw up.error;
          paths.push(path);
        }
        const { error } = await db.rpc('request_return', { p_item: i.id, p_qty: Number(qty.value), p_reason: reason.value, p_wants: wants.value, p_details: details.value.trim() || null, p_photos: paths });
        if (error) throw error;
        toast(T('Return request sent to the shop')); load();
      } catch (e) { err.textContent = T(e.message || 'Something went wrong. Please try again.'); err.hidden = false; send.disabled = false; send.textContent = T('Send return request'); }
    };
    holder.innerHTML = '';
    holder.append(h('div', { class: 'rate-form' },
      h('h3', { text: T('Return: {t}', { t: i.title }) }),
      h('p', { class: 'm', text: T('The shop checks your request and contacts you to collect the item. Refunds and exchanges are settled directly with the shop (RGBKart does not hold money).') }),
      h('div', { class: 'ret-grid' }, h('label', {}, T('How many'), qty), h('label', {}, T('What do you want?'), wants)),
      h('label', { class: 'ret-l' }, T('Reason'), reason),
      h('label', { class: 'ret-l' }, T('Details'), details),
      h('label', { class: 'ret-l' }, T('Photos (up to 3, recommended for damaged or wrong items)'), files),
      err, h('div', { class: 'oact' }, send, h('button', { type: 'button', text: T('Not now'), onclick: () => holder.innerHTML = '' }))));
    holder.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // ---------- Rate a delivered order (0029_reviews.sql) ----------
  const DAY = 864e5;
  function rateBox(o, shop, mine) {
    const holder = h('div', { class: 'rate' });
    const shopR = mine.find(r => !r.product_id);
    const items = [...new Map((o.order_items || []).filter(i => i.product_id).map(i => [i.product_id, i])).values()];
    const open = Date.now() - new Date(o.delivered_at || o.updated_at).getTime() < 90 * DAY;
    const canEdit = r => !r || Date.now() - new Date(r.created_at).getTime() < 30 * DAY;
    function summary() {
      holder.innerHTML = '';
      if (shopR) {
        holder.append(h('div', { class: 'rate-done' },
          h('span', {}, T('Your rating for the shop: '), starsEl(shopR.rating)),
          shopR.reply && h('span', { class: 'm', text: T('The shop replied: ') + shopR.reply }),
          (canEdit(shopR) || (open && items.some(i => !mine.find(r => r.product_id === i.product_id)))) &&
            h('button', { type: 'button', class: 'linkbtn', text: T('Change my review'), onclick: form })));
      } else if (open) {
        holder.append(h('div', { class: 'rate-ask' },
          h('span', {}, h('b', { text: T('How was this order?') }), ' ', h('span', { class: 'm', text: T('Your stars help other shoppers choose good shops.') })),
          h('button', { type: 'button', class: 'btn-acc', text: T('★ Rate this order'), onclick: form })));
      }
    }
    function block(title, r, sub) {
      const st = starInput(r ? r.rating : 0);
      const tx = h('textarea', { rows: 2, maxlength: 1000, placeholder: T(sub ? 'What did you like or not like about this product? (optional)' : 'How was the shop: packing, speed, behaviour? (optional)'), 'aria-label': T('Your review') });
      tx.value = r && r.comment || '';
      const locked = !canEdit(r);
      if (locked) { st.style.pointerEvents = 'none'; tx.disabled = true; }
      const el = h('div', { class: 'rate-item' }, h('div', { class: 'rate-h' }, h('b', { text: title, translate: sub ? 'no' : null }), st,
        locked && h('span', { class: 'm', text: T('(can no longer be changed)') })), tx);
      return { el, st, tx, locked };
    }
    function form() {
      holder.innerHTML = '';
      const sb = block(T('The shop: {s}', { s: L(shop, 'shop_name') || T('Shop') }), shopR, false);
      const pbs = items.map(i => ({ i, b: block(i.title, mine.find(r => r.product_id === i.product_id), true) }));
      const err = h('p', { class: 'm bad', hidden: true });
      const save = h('button', { type: 'button', class: 'btn-acc', text: T('Send review'), onclick: async () => {
        err.hidden = true;
        if (!sb.st.value) { err.textContent = T('Please give the shop 1 to 5 stars.'); err.hidden = false; return; }
        save.disabled = true;
        const jobs = [];
        if (!sb.locked) jobs.push([null, sb]);
        pbs.forEach(({ i, b }) => { if (b.st.value && !b.locked) jobs.push([i.product_id, b]); });
        for (const [pid, b] of jobs) {
          const { error } = await db.rpc('submit_review', { p_order: o.id, p_product: pid, p_rating: b.st.value, p_comment: b.tx.value.trim() || null });
          if (error) { save.disabled = false; err.textContent = error.message; err.hidden = false; return; }
        }
        toast(T('Thank you for your review!')); load();
      } });
      holder.append(h('div', { class: 'rate-form' },
        h('h3', { text: T('Rate this order') }),
        h('p', { class: 'm', text: T('Only buyers who received the order can review. Your first name and the first letter of your last name are shown with the review.') }),
        sb.el, pbs.length && h('div', { class: 'm', style: 'margin-top:6px', text: T('Rate the products (optional)') }), ...pbs.map(x => x.b.el), err,
        h('div', { class: 'oact' }, save, h('button', { type: 'button', text: T('Not now'), onclick: summary }))));
    }
    summary();
    return holder;
  }
  (async () => { await initShell(); load(); })();
</script>
</body>
</html>
