<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages | RGBKart</title>
<link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&family=Hind+Siliguri:wght@400;600&display=swap">
<link rel="stylesheet" href="shop.css?v=12">
<style>
  /* Layout: conversation list (left) + open chat (right); on phones one at a time */
  main { padding-block: 20px 40px; }
  h1 { font: 600 1.6rem/1.2 var(--display); margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
  .inbox { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; height: min(72vh, 720px); min-height: 440px; }
  .list { border-right: 1px solid var(--line); overflow-y: auto; }
  .tabs { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .tabs button { flex: 1; font: 600 .85rem var(--body); padding: 7px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .conv { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 12px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); cursor: pointer; font: inherit; }
  .conv:hover { background: var(--bg); }
  .conv[aria-current="true"] { background: var(--accent-soft); }
  .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 1.05rem var(--body); color: #fff; }
  .conv .nm { font-weight: 700; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .pt { font-size: .8rem; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .lm { font-size: .84rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv.unread .lm { color: var(--fg); font-weight: 600; }
  .conv .side { display: grid; justify-items: end; gap: 6px; font-size: .74rem; color: var(--faint); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--buy); }
  .role { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px; background: var(--bg); color: var(--muted); }
  .role.sell { background: #fff4dc; color: #8a5a00; }
  @media (prefers-color-scheme: dark) { .role.sell { background: #3a2f17; color: #f0c060; } }

  .chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
  .chat-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
  .chat-head .back { display: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 6px 10px; font: 700 1rem var(--body); cursor: pointer; }
  .chat-head .who { min-width: 0; }
  .chat-head b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-head a { font-size: .85rem; font-weight: 600; text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
  .bub { max-width: min(78%, 520px); padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; line-height: 1.4; }
  .bub time { display: block; font-size: .7rem; opacity: .7; margin-top: 3px; }
  .bub.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bub.me { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
  .day { align-self: center; font-size: .74rem; color: var(--faint); font-weight: 600; margin: 6px 0; }
  .reply { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); align-items: flex-end; }
  .reply textarea { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: none; height: 46px; max-height: 140px; }
  .reply textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .reply button { font: 700 .95rem var(--body); border: 0; border-radius: 12px; padding: 0 18px; height: 46px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  .reply button:hover:not(:disabled) { background: var(--accent-hover); }
  .reply button:disabled { opacity: .6; cursor: wait; }
  .blank { display: grid; place-content: center; text-align: center; color: var(--muted); padding: 30px; gap: 6px; }
  .blank b { color: var(--fg); font-size: 1.05rem; }
  .err { color: var(--danger); font-size: .88rem; padding: 0 12px 8px; margin: 0; }
  @media (max-width: 760px) {
    .inbox { grid-template-columns: minmax(0, 1fr); height: calc(100dvh - 190px); min-height: 420px; }
    .inbox.open .list { display: none; }
    .inbox:not(.open) .chat { display: none; }
    .chat-head .back { display: inline-block; }
    .list { border-right: 0; }
    .fab { display: none; }
    body.chatting main h1, body.chatting .lead { display: none; }
    body.chatting main { padding-block: 10px; }
    body.chatting .inbox { height: calc(100dvh - 150px); min-height: 360px; }
    body.chatting footer { display: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>Messages</h1>
  <p class="lead">Chats with buyers and sellers. They're kept on this phone or browser, so keep using it to see replies.</p>
  <div class="inbox" id="inbox">
    <div class="list">
      <div class="tabs" role="group" aria-label="Show">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="buying" aria-pressed="false">Buying</button>
        <button type="button" data-f="selling" aria-pressed="false">Selling</button>
      </div>
      <div id="convs"></div>
    </div>
    <section class="chat" id="chat" aria-live="polite">
      <div class="blank" id="blank"><b>Pick a conversation</b><span>Your messages appear here.</span></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="i18n.js?v=3"></script>
<script src="shop.js?v=13"></script>
<script src="menu.js?v=5"></script>
<script>
  let me = null, convs = [], names = new Map(), openId = null, filter = 'all', lastStamp = '';
  const COLORS = ['#00802B', '#4f46e5', '#c2410c', '#be185d', '#15803d', '#7c3aed', '#0369a1', '#b45309'];
  const colorOf = s => COLORS[[...(s || '?')].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
  const isSeller = c => c.seller_id === me;
  const otherName = c => isSeller(c) ? c.buyer_name : (names.get(c.seller_id) || 'Seller');
  const unread = c => c.last_sender_id && c.last_sender_id !== me && (isSeller(c) ? (!c.seller_read_at || c.last_message_at > c.seller_read_at) : c.last_message_at > c.buyer_read_at);
  const when = t => { const d = new Date(t), now = new Date(); return d.toDateString() === now.toDateString() ? d.toLocaleTimeString((LANG === 'bn' ? 'bn-BD' : 'en-GB'), { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString((LANG === 'bn' ? 'bn-BD' : 'en-GB'), { day: 'numeric', month: 'short' }); };

  async function start() {
    await initShell();
    const { data: { session } } = await db.auth.getSession();
    if (!session) return empty('No messages yet', 'When you message a seller, or a buyer messages you, the chat appears here.');
    me = session.user.id;
    await loadConvs();
    const want = Number(new URLSearchParams(location.search).get('c'));
    if (want && convs.some(c => c.id === want)) openConv(want);
    setInterval(poll, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  }

  function empty(title, text) {
    $('convs').innerHTML = '';
    $('convs').append(h('div', { class: 'blank', style: 'min-height:240px' }, h('b', { text: title }), h('span', { text: text }), h('a', { href: 'browse.html', text: 'Browse products', style: 'font-weight:700;margin-top:6px' })));
  }

  async function loadConvs() {
    const r = await db.from('conversations').select('*').order('last_message_at', { ascending: false });
    if (r.error) return empty('Messages aren\'t ready yet', /does not exist|Could not find/i.test(r.error.message) ? 'The site owner needs to run contact_messages.sql.' : r.error.message);
    convs = r.data;
    const sellers = [...new Set(convs.filter(c => !isSeller(c)).map(c => c.seller_id))].filter(id => !names.has(id));
    if (sellers.length) {
      const s = await db.from('shops').select('user_id, shop_name, shop_name_bn').in('user_id', sellers);
      (s.data || []).forEach(x => names.set(x.user_id, L(x, 'shop_name')));
    }
    lastStamp = convs.map(c => c.id + c.last_message_at).join();
    drawList();
  }

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    filter = b.dataset.f; document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); drawList();
  });

  function drawList() {
    const box = $('convs'); box.innerHTML = '';
    const rows = convs.filter(c => filter === 'all' || (filter === 'selling') === isSeller(c));
    if (!convs.length) return empty('No messages yet', 'When you message a seller, or a buyer messages you, the chat appears here.');
    if (!rows.length) { box.append(h('div', { class: 'blank', style: 'min-height:160px' }, h('span', { text: filter === 'selling' ? 'No buyers have messaged you yet.' : 'You haven\'t messaged any sellers yet.' }))); return; }
    for (const c of rows) {
      const nm = otherName(c), u = unread(c);
      box.append(h('button', { type: 'button', class: 'conv' + (u ? ' unread' : ''), 'aria-current': String(c.id === openId), onclick: () => openConv(c.id) },
        h('span', { class: 'av', style: `background:${colorOf(nm)}`, text: nm.charAt(0).toUpperCase(), 'aria-hidden': 'true' }),
        h('span', { style: 'min-width:0;display:grid;gap:1px' },
          h('span', { class: 'nm' }, nm, ' ', h('span', { class: 'role' + (isSeller(c) ? ' sell' : ''), text: isSeller(c) ? 'Buyer' : 'Seller' })),
          h('span', { class: 'pt', text: c.product_title, translate: 'no' }),
          h('span', { class: 'lm', translate: 'no', text: (c.last_sender_id === me ? T('You: ') : '') + (c.last_message || '') })),
        h('span', { class: 'side' }, h('span', { text: when(c.last_message_at) }), u && h('span', { class: 'dot', 'aria-label': 'New message' }))));
    }
  }

  async function openConv(id) {
    openId = id;
    const c = convs.find(x => x.id === id); if (!c) return;
    $('inbox').classList.add('open'); document.body.classList.add('chatting');
    const chat = $('chat'); chat.innerHTML = '';
    const nm = otherName(c);
    const thread = h('div', { class: 'thread', id: 'thread' });
    const ta = h('textarea', { id: 'replyText', maxlength: '1000', placeholder: 'Write a reply…', 'aria-label': 'Reply', rows: '1' });
    const send = h('button', { type: 'submit', text: 'Send' });
    const err = h('p', { class: 'err', role: 'alert', hidden: true });
    const form = h('form', { class: 'reply' }, ta, send);
    chat.append(
      h('div', { class: 'chat-head' },
        h('button', { type: 'button', class: 'back', 'aria-label': 'Back to all messages', text: '←', onclick: () => { $('inbox').classList.remove('open'); document.body.classList.remove('chatting'); openId = null; drawList(); } }),
        h('span', { class: 'av', style: `background:${colorOf(nm)};width:38px;height:38px;font-size:.95rem`, text: nm.charAt(0).toUpperCase(), 'aria-hidden': 'true' }),
        h('div', { class: 'who' }, h('b', { text: nm + (isSeller(c) ? ' (buyer)' : '') }),
          c.product_id ? h('a', { href: `product.html?id=${c.product_id}`, text: c.product_title, translate: 'no' }) : h('span', { class: 'pt', text: c.product_title + T(' (removed)') }))),
      thread, h('div', {}, err, form));
    ta.oninput = () => { ta.style.height = '46px'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; };
    ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 761px)').matches) { e.preventDefault(); form.requestSubmit(); } };
    form.onsubmit = async e => {
      e.preventDefault(); const body = ta.value.trim(); if (!body) return;
      send.disabled = true; err.hidden = true;
      const r = await db.rpc('send_message', { p_body: body, p_product: null, p_conversation: id, p_name: null });
      send.disabled = false;
      if (r.error) { err.textContent = /Failed to fetch/i.test(r.error.message) ? 'No internet connection. Try again.' : r.error.message; err.hidden = false; return; }
      ta.value = ''; ta.oninput(); await loadThread(id); await loadConvs();
      ta.focus();
    };
    await loadThread(id);
    await db.rpc('mark_conversation_read', { p_conversation: id });
    const cc = convs.find(x => x.id === id); if (cc) { cc.buyer_read_at = cc.seller_read_at = new Date().toISOString(); }
    drawList(); updateBadges();
    if (window.matchMedia('(min-width: 761px)').matches) ta.focus();
  }

  async function loadThread(id) {
    const r = await db.from('messages').select('id, sender_id, body, created_at').eq('conversation_id', id).order('created_at');
    const box = $('thread'); if (!box || openId !== id) return;
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.innerHTML = '';
    let day = '';
    for (const m of r.data || []) {
      const d = new Date(m.created_at).toLocaleDateString((LANG === 'bn' ? 'bn-BD' : 'en-GB'), { weekday: 'short', day: 'numeric', month: 'short' });
      if (d !== day) { day = d; box.append(h('div', { class: 'day', text: d })); }
      box.append(h('div', { class: 'bub ' + (m.sender_id === me ? 'me' : 'them') }, h('span', { translate: 'no', text: m.body }),
        h('time', { datetime: m.created_at, text: new Date(m.created_at).toLocaleTimeString((LANG === 'bn' ? 'bn-BD' : 'en-GB'), { hour: '2-digit', minute: '2-digit' }) })));
    }
    if (atBottom || box.dataset.first !== '1') { box.scrollTop = box.scrollHeight; box.dataset.first = '1'; }
  }

  async function poll() {
    if (!me || document.hidden) return;
    const before = lastStamp;
    await loadConvs();
    if (lastStamp !== before && openId) {
      await loadThread(openId); await db.rpc('mark_conversation_read', { p_conversation: openId });
      const cc = convs.find(x => x.id === openId); if (cc) { cc.buyer_read_at = cc.seller_read_at = new Date().toISOString(); drawList(); }
    }
    updateBadges();
  }

  start();
</script>
</body>
</html>
