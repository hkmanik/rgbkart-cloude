<style>
  .doc-wrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; padding-block: 18px 10px; }
  .doc-nav { position: sticky; top: calc(var(--head-h, 120px) + 12px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 2px; }
  .doc-nav a { color: var(--fg); text-decoration: none; padding: 8px 12px; border-radius: 9px; font-size: .94rem; }
  .doc-nav a:hover { background: var(--bg); }
  .doc-nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .doc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 3vw, 36px); min-width: 0; max-width: 820px; }
  .doc h1 { font: 700 clamp(1.5rem, 3vw, 2rem)/1.25 var(--display); margin: 0 0 14px; }
  .doc h2 { font: 600 1.15rem var(--display); margin: 26px 0 8px; color: var(--accent); }
  .doc p { margin: 0 0 12px; line-height: 1.7; overflow-wrap: anywhere; }
  .doc ul, .doc ol { margin: 0 0 14px; padding-left: 22px; line-height: 1.7; }
  .doc li { margin-bottom: 4px; overflow-wrap: anywhere; }
  .doc .upd { color: var(--faint); font-size: .84rem; margin-top: 24px; border-top: 1px solid var(--line); padding-top: 12px; }
  .doc mark { background: #FFF6CC; color: #6B5300; border-radius: 4px; padding: 0 3px; }
  @media (max-width: 820px) { .doc-wrap { grid-template-columns: minmax(0, 1fr); } .doc-nav { position: static; display: flex; flex-wrap: wrap; } }
</style>
</head>
<body>

<main class="wrap">
  <div class="doc-wrap">
    <nav class="doc-nav" id="docNav" aria-label="Information pages"></nav>
    <article class="doc" id="doc"><p>Loading…</p></article>
  </div>
</main>

<script src="session.js?v=1"></script>
<script src="phone.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="i18n.js?v=31"></script>
<script src="sync.js?v=1"></script>
<script src="shop.js?v=26"></script>
<script src="menu.js?v=6"></script>
<script>
  const slug = (new URLSearchParams(location.search).get('p') || 'about').toLowerCase();
  // Simple text format used in Admin → Pages: "## " heading, "- " bullet, "1. " numbered, blank line = new paragraph, **bold**
  function inline(text, el) {
    const parts = text.split(/(\*\*[^*]+\*\*|\[[^\]]+\])/g);
    parts.forEach(p => {
      if (/^\*\*[^*]+\*\*$/.test(p)) el.append(h('b', { text: p.slice(2, -2) }));
      else if (/^\[[^\]]+\]$/.test(p)) el.append(h('mark', { text: p }));          // [placeholder] still to fill in
      else if (p) el.append(document.createTextNode(p));
    });
    return el;
  }
  function render(body) {
    const out = []; let list = null, para = [];
    const flush = () => { if (para.length) { out.push(inline(para.join(' '), h('p'))); para = []; } };
    for (const raw of body.replace(/\r/g, '').split('\n')) {
      const line = raw.trim();
      let m;
      if (!line) { flush(); list = null; continue; }
      if ((m = line.match(/^#{2,3}\s+(.*)$/))) { flush(); list = null; out.push(h('h2', { text: m[1] })); continue; }
      if ((m = line.match(/^(?:[-•*])\s+(.*)$/)) || (m = line.match(/^(?:\d+|[০-৯]+)[.)।]\s+(.*)$/))) {
        flush();
        const ordered = !/^[-•*]/.test(line);
        if (!list || list.ordered !== ordered) { list = h(ordered ? 'ol' : 'ul'); list.ordered = ordered; out.push(list); }
        list.append(inline(m[1], h('li'))); continue;
      }
      list = null; para.push(line);
    }
    flush();
    return out;
  }
  async function load() {
    const r = await db.from('site_pages').select('*').order('sort_order');
    const doc = $('doc'); doc.innerHTML = '';
    if (r.error) { doc.append(h('h1', { text: T('Coming soon') }), h('p', { text: T('This page is being prepared.') })); return; }
    const pages = (r.data || []).filter(p => p.is_active);
    $('docNav').innerHTML = '';
    pages.forEach(p => $('docNav').append(h('a', { href: 'page.html?p=' + encodeURIComponent(p.slug), text: L(p, 'title'), 'aria-current': p.slug === slug ? 'page' : null })));
    const pg = pages.find(p => p.slug === slug);
    if (!pg) { doc.append(h('h1', { text: T('Page not found') }), h('p', {}, h('a', { href: 'index.html', text: T('Back to RGBKart') }))); return; }
    const bn = document.documentElement.lang === 'bn' && pg.body_bn;
    document.title = L(pg, 'title') + ' | RGBKart';
    doc.setAttribute('translate', 'no');
    doc.append(h('h1', { text: L(pg, 'title') }), ...render(bn ? pg.body_bn : pg.body),
      h('p', { class: 'upd', text: T('Last changed: {d}', { d: RGBLang.date(pg.updated_at, { day: 'numeric', month: 'long', year: 'numeric' }) }) }));
  }
  (async () => { await initShell(); load(); })();
</script>
</body>
</html>
