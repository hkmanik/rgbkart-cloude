<style>
/* Layout: marketplace shell — flag-green header band, red as the action/offer colour, dense product grids; dashboards use a sidebar + work area. */
:root{
  --green:#00802B; --green-strong:#006622; --green-tint:#E5F4EA; --on-green:#FFFFFF;
  --red:#E30613; --red-strong:#B8000C; --red-tint:#FDE7E8; --on-red:#FFFFFF;
  --gold:#A87400; --gold-tint:#FFF4CC; --yellow:#F5C400; --yellow-strong:#E0A800; --on-yellow:#1F2A10;
  --bg:#F4F7F5; --surface:#FFFFFF; --surface-2:#EDF2EF; --line:#D9E2DC;
  --ink:#14211C; --muted:#5A6A62; --focus:#F42A41;
  --band:#00802B; --band-strong:#006622; --band-ink:#FFFFFF; --band-muted:rgba(255,255,255,.78);
  --paper:#FFFFFF; --paper-ink:#111; --paper-line:#BBB;
  --shadow:0 1px 2px rgba(10,40,28,.06),0 4px 14px rgba(10,40,28,.06);
  --f-head:"Poppins","Hind Siliguri",system-ui,sans-serif;
  --f-body:"Roboto","Hind Siliguri",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --green:#2EBB5C; --green-strong:#49CC73; --green-tint:#14301E; --on-green:#03150A;
  --red:#FF4D55; --red-strong:#FF6B72; --red-tint:#3A1A1C; --on-red:#1C0304;
  --gold:#F5C400; --gold-tint:#3A3110; --band:#0E5A28; --band-strong:#0A4420; --band-ink:#FFFFFF; --band-muted:rgba(255,255,255,.75); --yellow:#FFD21F; --yellow-strong:#FFE066; --on-yellow:#1F2A10;
  --bg:#0D1411; --surface:#141E1A; --surface-2:#1B2722; --line:#2A3832;
  --ink:#E6EEEA; --muted:#9CACA4; --focus:#FF5A6D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#2EBB5C; --green-strong:#49CC73; --green-tint:#14301E; --on-green:#03150A;
  --red:#FF4D55; --red-strong:#FF6B72; --red-tint:#3A1A1C; --on-red:#1C0304;
  --gold:#F5C400; --gold-tint:#3A3110; --band:#0E5A28; --band-strong:#0A4420; --band-ink:#FFFFFF; --band-muted:rgba(255,255,255,.75); --yellow:#FFD21F; --yellow-strong:#FFE066; --on-yellow:#1F2A10;
  --bg:#0D1411; --surface:#141E1A; --surface-2:#1B2722; --line:#2A3832;
  --ink:#E6EEEA; --muted:#9CACA4; --focus:#FF5A6D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.25;margin:0;text-wrap:balance;font-weight:600}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.05rem} h4{font-size:.95rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);margin:4px 0}

/* top strip + header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band-strong)}
.strip{background:var(--band-strong);color:var(--band-ink);font-size:.8rem}
.strip .wrap{display:flex;gap:14px;align-items:center;justify-content:space-between;padding-block:6px;flex-wrap:wrap}
.strip select{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:2px 6px;font-size:.78rem}
.strip select option{color:#111}
.langsw{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.langsw button{background:transparent;border:0;color:#fff;padding:3px 10px;cursor:pointer;font-size:.78rem}
.langsw button[aria-pressed="true"]{background:#fff;color:#006A4E;font-weight:700}
header.main{border-bottom:3px solid var(--yellow);background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header.main .wrap{display:flex;gap:16px;align-items:center;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;cursor:pointer;background:none;border:0;padding:0}
.logo b{font-family:var(--f-head);font-size:1.35rem;letter-spacing:-.01em}
.logo b i{font-style:normal;color:#FFD21F}
.logo small{display:block;font-size:.66rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase;margin-top:-3px}
.logo img{height:46px;width:46px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.search{flex:1;display:flex;min-width:0;background:#fff;border-radius:8px;overflow:hidden}
.search select{border:0;background:#EEF4F1;color:#14211C;padding:0 8px;max-width:150px}
.search input{flex:1;min-width:0;border:0;padding:10px 12px;color:#14211C;background:#fff}
.search button{border:0;background:var(--yellow);color:#1F2A10;padding:0 16px;cursor:pointer}
.search button:hover{background:var(--red);color:#fff}
.hbtn{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:#fff;cursor:pointer;padding:6px 8px;border-radius:8px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}

/* modal, toast */
.modal-bg{position:fixed;inset:0;background:rgba(5,15,10,.55);z-index:50;display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.wide{width:min(820px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mb{padding:18px;display:flex;flex-direction:column;gap:12px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;box-shadow:var(--shadow);animation:tin .2s ease-out}

/* printable docs */

.doc .r{text-align:right}
.label{width:100%;max-width:420px;margin:0 auto;border:2px solid #111;border-radius:6px;padding:0;font-size:.85rem;background:var(--paper);color:var(--paper-ink)}
.label .lb{padding:10px 12px;border-bottom:2px solid #111}

.barcode{display:flex;height:54px;align-items:stretch;gap:0;justify-content:center;overflow:hidden}
