<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your cart | RGBKart</title>
<link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&family=Hind+Siliguri:wght@400;600&display=swap">
<link rel="stylesheet" href="shop.css?v=11">
<link rel="stylesheet" href="order.css?v=1">
</head>
<body>

<main class="wrap ord-main">
  <div class="steps" aria-label="Checkout steps"><span class="on">1 Cart</span><span>2 Delivery &amp; payment</span><span>3 Done</span></div>
  <h1>Your cart</h1>
  <p class="lead">Each shop packs and sends its own items, so you get one order per shop. You pay the shop in cash when it arrives.</p>
  <div id="content"><div class="box">Loading your cart…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="i18n.js?v=2"></script>
<script src="shop.js?v=11"></script>
<script src="menu.js?v=3"></script>
<script src="cartlib.js?v=1"></script>
<script>
  let data = null;
  function setQty(idx, q) {
    const cart = CartLib.read(); if (!cart[idx]) return;
    cart[idx].qty = q; CartLib.write(cart); draw();
  }
  function remove(idx) { const cart = CartLib.read(); cart.splice(idx, 1); CartLib.write(cart); draw(); }

  function itemRow(i) {
    return h('div', { class: 'citem' + (i.problem ? ' off' : '') },
      i.image ? h('img', { src: i.image, alt: '' }) : h('div', { class: 'noimg' }),
      h('div', { style: 'min-width:0;display:grid;gap:2px' },
        h('a', { class: 't', href: `product.html?id=${i.product_id}`, text: i.title, translate: 'no' }),
        i.variant && h('div', { class: 'm', text: i.variant }),
        i.problem ? h('div', { class: 'm bad', text: i.problem }) : h('div', { class: 'm', text: T('{p} each', { p: money(i.unit) }) }),
        i.note && h('div', { class: 'm warn', text: i.note }),
        !i.problem && h('div', { class: 'qty' },
          h('button', { type: 'button', 'aria-label': 'Less', text: '−', disabled: i.qty <= 1, onclick: () => setQty(i.idx, i.qty - 1) }),
          h('span', { text: i.qty, 'aria-live': 'polite' }),
          h('button', { type: 'button', 'aria-label': 'More', text: '+', disabled: i.qty >= i.max, onclick: () => setQty(i.idx, i.qty + 1) }))),
      h('div', { style: 'display:grid;justify-items:end;gap:6px' },
        !i.problem && h('span', { class: 'line', text: money(i.qty * i.unit) }),
        h('button', { type: 'button', class: 'rm', text: 'Remove', onclick: () => remove(i.idx) })));
  }

  async function draw() {
    data = await CartLib.load();
    // keep capped quantities
    const cart = CartLib.read(); let changed = false;
    (data.items || []).forEach(i => { if (i.note && cart[i.idx] && cart[i.idx].qty !== i.qty) { cart[i.idx].qty = i.qty; changed = true; } });
    if (changed) CartLib.write(cart);
    const box = $('content'); box.innerHTML = '';
    if (!CartLib.read().length) {
      box.append(h('div', { class: 'box empty-cart' }, h('b', { text: 'Your cart is empty' }), h('span', { text: 'Find something you like and tap "Add to cart".' }),
        h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center' }, h('a', { class: 'btn-acc', href: 'browse.html', text: 'Start shopping' }), h('a', { class: 'btn-line', href: 'orders.html', text: 'My orders' }))));
      return;
    }
    const left = h('div', { class: 'groups' });
    for (const g of data.groups) {
      const opts = h('div', { class: 'ship', role: 'radiogroup', 'aria-label': T('Delivery from {s}', { s: L(g.shop, 'shop_name') }) });
      g.options.forEach(o => opts.append(h('label', { class: 'ship-o' },
        h('input', { type: 'radio', name: 'ship_' + g.seller, value: o.id, checked: g.method && g.method.id === o.id, onchange: () => { CartLib.setShip(g.seller, o.id); draw(); } }),
        h('span', { class: 'grow' }, h('b', { text: o.name }), h('small', { text: o.id === 'pickup' ? (g.shop.pickup_address || 'From the shop') : (o.eta || '') })),
        h('b', { class: 'fee', text: o.id === 'negotiated' ? 'Agree with shop' : g.feeOf(o) ? money(g.feeOf(o)) : 'Free' }))));
      left.append(h('section', { class: 'box group' },
        h('div', { class: 'ghead' }, h('span', { class: 'shopic', 'aria-hidden': 'true', text: (g.shop.shop_name || '?').charAt(0).toUpperCase() }), h('b', { text: T('From {s}', { s: L(g.shop, 'shop_name') }) }), h('span', { class: 'sub', text: money(g.subtotal) })),
        g.items.map(itemRow),
        h('div', { class: 'gfoot' }, h('b', { class: 'small', text: 'Delivery' }), opts, g.allFree && h('p', { class: 'm good', text: '✓ Free delivery from this shop' }))));
    }
    if (data.problems.length) left.append(h('section', { class: 'box group' }, h('div', { class: 'ghead' }, h('b', { text: 'Can\'t be ordered' })), data.problems.map(itemRow)));
    const total = data.groups.reduce((a, g) => a + g.total, 0);
    const sum = h('aside', { class: 'box sum' }, h('h2', { text: 'Order summary' }),
      data.groups.map(g => h('div', { class: 'srow-g' }, h('b', { class: 'small', text: L(g.shop, 'shop_name'), translate: 'no' }),
        h('div', { class: 'srow' }, h('span', { text: T('Items ({n})', { n: g.items.reduce((a, i) => a + i.qty, 0) }) }), h('span', { text: money(g.subtotal) })),
        h('div', { class: 'srow' }, h('span', { text: g.method ? g.method.name : 'Delivery' }), h('span', { text: g.method && g.method.id === 'negotiated' ? 'Agree with shop' : g.fee ? money(g.fee) : 'Free' })))),
      h('div', { class: 'srow total' }, h('span', { text: 'Total' }), h('span', { text: money(total) })),
      h('p', { class: 'm', text: 'Pay in cash when your order arrives (Cash on Delivery).' }),
      data.groups.length ? h('a', { class: 'go', href: 'checkout.html', text: 'Checkout →' }) : h('span', { class: 'm bad', text: 'Remove the items that can\'t be ordered to continue.' }),
      h('a', { class: 'more', href: 'browse.html', text: '← Continue shopping' }));
    box.append(h('div', { class: 'cartgrid' }, left, sum));
  }
  (async () => { await initShell(); draw(); })();
</script>
</body>
</html>
