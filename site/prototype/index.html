<style>
/* Layout: marketplace shell — flag-green header band, red as the action/offer colour, dense product grids; dashboards use a sidebar + work area. */
:root{
  --green:#00802B; --green-strong:#006622; --green-tint:#E5F4EA; --on-green:#FFFFFF;
  --red:#E30613; --red-strong:#B8000C; --red-tint:#FDE7E8; --on-red:#FFFFFF;
  --gold:#A87400; --gold-tint:#FFF4CC; --yellow:#F5C400; --yellow-strong:#E0A800; --on-yellow:#1F2A10;
  --bg:#F4F7F5; --surface:#FFFFFF; --surface-2:#EDF2EF; --line:#D9E2DC;
  --ink:#14211C; --muted:#5A6A62; --focus:#F42A41;
  --band:#00802B; --band-strong:#006622; --band-ink:#FFFFFF; --band-muted:rgba(255,255,255,.78);
  --paper:#FFFFFF; --paper-ink:#111; --paper-line:#BBB;
  --shadow:0 1px 2px rgba(10,40,28,.06),0 4px 14px rgba(10,40,28,.06);
  --f-head:"Poppins","Hind Siliguri",system-ui,sans-serif;
  --f-body:"Roboto","Hind Siliguri",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --green:#2EBB5C; --green-strong:#49CC73; --green-tint:#14301E; --on-green:#03150A;
  --red:#FF4D55; --red-strong:#FF6B72; --red-tint:#3A1A1C; --on-red:#1C0304;
  --gold:#F5C400; --gold-tint:#3A3110; --band:#0E5A28; --band-strong:#0A4420; --band-ink:#FFFFFF; --band-muted:rgba(255,255,255,.75); --yellow:#FFD21F; --yellow-strong:#FFE066; --on-yellow:#1F2A10;
  --bg:#0D1411; --surface:#141E1A; --surface-2:#1B2722; --line:#2A3832;
  --ink:#E6EEEA; --muted:#9CACA4; --focus:#FF5A6D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#2EBB5C; --green-strong:#49CC73; --green-tint:#14301E; --on-green:#03150A;
  --red:#FF4D55; --red-strong:#FF6B72; --red-tint:#3A1A1C; --on-red:#1C0304;
  --gold:#F5C400; --gold-tint:#3A3110; --band:#0E5A28; --band-strong:#0A4420; --band-ink:#FFFFFF; --band-muted:rgba(255,255,255,.75); --yellow:#FFD21F; --yellow-strong:#FFE066; --on-yellow:#1F2A10;
  --bg:#0D1411; --surface:#141E1A; --surface-2:#1B2722; --line:#2A3832;
  --ink:#E6EEEA; --muted:#9CACA4; --focus:#FF5A6D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.25;margin:0;text-wrap:balance;font-weight:600}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.05rem} h4{font-size:.95rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);margin:4px 0}

/* top strip + header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band-strong)}
.strip{background:var(--band-strong);color:var(--band-ink);font-size:.8rem}
.strip .wrap{display:flex;gap:14px;align-items:center;justify-content:space-between;padding-block:6px;flex-wrap:wrap}
.strip select{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:2px 6px;font-size:.78rem}
.strip select option{color:#111}
.langsw{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.langsw button{background:transparent;border:0;color:#fff;padding:3px 10px;cursor:pointer;font-size:.78rem}
.langsw button[aria-pressed="true"]{background:#fff;color:#006A4E;font-weight:700}
header.main{border-bottom:3px solid var(--yellow);background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header.main .wrap{display:flex;gap:16px;align-items:center;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;cursor:pointer;background:none;border:0;padding:0}
.logo b{font-family:var(--f-head);font-size:1.35rem;letter-spacing:-.01em}
.logo b i{font-style:normal;color:#FFD21F}
.logo small{display:block;font-size:.66rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase;margin-top:-3px}
.logo img{height:46px;width:46px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.search{flex:1;display:flex;min-width:0;background:#fff;border-radius:8px;overflow:hidden}
.search select{border:0;background:#EEF4F1;color:#14211C;padding:0 8px;max-width:150px}
.search input{flex:1;min-width:0;border:0;padding:10px 12px;color:#14211C;background:#fff}
.search button{border:0;background:var(--yellow);color:#1F2A10;padding:0 16px;cursor:pointer}
.search button:hover{background:var(--red);color:#fff}
.hbtn{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:#fff;cursor:pointer;padding:6px 8px;border-radius:8px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}

.upl label input{display:none}
.radiocards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radiocards label{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.radiocards label:has(input:checked){border-color:var(--green);background:var(--green-tint)}
.radiocards label.dis{opacity:.55;cursor:not-allowed}
.radiocards input{accent-color:var(--green);margin-top:3px}
@media (max-width:520px){.radiocards{grid-template-columns:1fr}}

/* modal, toast */
.modal-bg{position:fixed;inset:0;background:rgba(5,15,10,.55);z-index:50;display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.wide{width:min(820px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mb{padding:18px;display:flex;flex-direction:column;gap:12px}
.x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:99px;cursor:pointer;font-size:1rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;box-shadow:var(--shadow);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* printable docs */
.doc{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);padding:24px;font-size:.85rem;border-radius:4px}
.doc h2{color:var(--paper-ink)}
.doc table{width:100%;border-collapse:collapse;margin-top:10px}
.doc th,.doc td{border-bottom:1px solid var(--paper-line);padding:6px 4px;text-align:left}
.doc th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.doc .r{text-align:right}
.label{width:100%;max-width:420px;margin:0 auto;border:2px solid #111;border-radius:6px;padding:0;font-size:.85rem;background:var(--paper);color:var(--paper-ink)}
.label .lb{padding:10px 12px;border-bottom:2px solid #111}
.label .lb:last-child{border-bottom:0}
.label .big{font-size:1.15rem;font-weight:700;font-family:var(--f-head)}
.barcode{display:flex;height:54px;align-items:stretch;gap:0;justify-content:center;overflow:hidden}
.barcode i{background:#111;display:block}

footer.site{background:var(--band);color:var(--band-ink);border-top:3px solid var(--yellow);margin-top:24px}
.fbar{background:var(--band-strong);color:var(--band-muted);font-size:.8rem}
.fbar .wrap{display:block!important;padding-block:12px!important}
footer.site .muted,footer.site .tiny.muted{color:var(--band-muted)}
footer.site h4{color:var(--band-ink)}
footer.site .wrap{padding-block:28px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:20px}
footer.site h4{margin-bottom:8px}
footer.site button{background:none;border:0;padding:3px 0;cursor:pointer;color:var(--band-muted);display:block;text-align:left;transition:color .15s,transform .15s}
footer.site button:hover{color:#FFD21F;transform:translateX(3px)}
footer .mfs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.paybadge{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:6px;background:#fff;color:var(--c);border:1.5px solid var(--c);font-weight:700;font-size:.78rem;white-space:nowrap;font-family:var(--f-head)}
.paylogo{display:inline-flex;align-items:center;justify-content:center;height:28px;min-width:44px;padding:2px 6px;border-radius:6px;background:#fff;border:1px solid #E2E2E2}
.paylogo img{height:22px;width:auto;max-width:90px;object-fit:contain}
@media (max-width:760px){footer.site .wrap{grid-template-columns:1fr 1fr}}
.empty{padding:40px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.authbox{max-width:520px;margin:28px auto;padding:24px}
.demo-acc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.demo-acc{grid-template-columns:1fr}}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.75rem;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--green);color:var(--on-green)}
.steps span.done{background:var(--green-tint);color:var(--green)}

/* ---- product card (Fixit style) ---- */
.pcard{cursor:pointer}
.pimgwrap{position:relative;overflow:hidden}
.wishbtn{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:999px;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .15s,color .15s;z-index:2}
.wishbtn svg{width:20px;height:20px}
.wishbtn:hover{transform:scale(1.12);color:var(--red)}
.wishbtn.on{color:var(--red)}
.wishbtn.on svg{fill:currentColor}
.pcard .pbody{padding:12px 14px 16px;gap:6px}
.tagrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:22px}
.pill.solid-y{background:var(--yellow);color:var(--on-yellow)}
.pbrand{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.pcard .ptitle{font-family:var(--f-head);font-weight:600;font-size:.95rem;min-height:2.6em}
.pcard .price{font-size:1.2rem}
.cartbtn{margin-top:6px;border-radius:999px;background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600;padding:9px 18px;transition:background .18s,border-color .18s,transform .18s}
.cartbtn:hover{background:var(--green);border-color:var(--green);color:var(--on-green);transform:scale(1.04)}
.pgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.pgrid.four{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.pgrid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.pcard .pbody{padding:10px 8px 12px}.cartbtn{padding:8px 10px;font-size:.8rem}.wishbtn{width:32px;height:32px}}
/* ---- category tiles ---- */
.catgrid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:16px!important}
@media (max-width:760px){.catgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}}
.cattile{position:relative;aspect-ratio:5/4;max-width:100%;border-radius:16px;overflow:hidden;border:0!important;padding:16px 12px 18px!important;justify-content:flex-end!important;gap:8px!important;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cattile::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,22,16,0) 38%,rgba(10,22,16,.88) 100%);z-index:0}
.cattile>*{position:relative;z-index:1}
.ccount{position:absolute!important;top:12px;right:12px;background:#fff;color:#14211C;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cicon{position:absolute!important;top:16%;left:50%;transform:translateX(-50%);width:44%;max-width:120px;aspect-ratio:1;transition:transform .3s}
.cicon svg{width:100%;height:100%;stroke-width:2.1}
.cname{color:#fff;font-family:var(--f-head);font-weight:700;font-size:1.15rem;text-shadow:0 1px 3px rgba(0,0,0,.4);text-align:center;line-height:1.2}
.cbar{width:36px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--yellow));transition:width .25s}
.cattile:hover{transform:translateY(-6px);box-shadow:0 16px 30px rgba(8,40,18,.25)}
.cattile:hover .cicon{transform:translateX(-50%) scale(1.1) rotate(-4deg)}
.cattile:hover .cbar{width:64px}
@media (max-width:480px){.cname{font-size:.95rem}}
/* ---- catalogue page ---- */
.cathead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:12px;flex-wrap:wrap}
.cathead h1{font-size:1.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:500;transition:border-color .15s,background .15s,color .15s}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.filters{gap:0!important;padding:4px 18px 14px!important}
.fgroup{display:flex;flex-direction:column;gap:7px;padding-block:14px;border-bottom:1px solid var(--line)}
.fgroup:last-of-type{border-bottom:0}
.fgroup h4{font-size:.95rem!important;text-transform:none!important;letter-spacing:0!important;color:var(--ink)!important;font-family:var(--f-head);margin-bottom:2px}
.fgroup .check{font-size:.92rem}
.fgroup input[type=radio]{accent-color:var(--green);width:16px;height:16px}
.filtertoggle{display:none}
@media (max-width:860px){.filtertoggle{display:inline-flex}.filterside{display:none!important}.filterside.open{display:flex!important}}
@media (max-width:760px){header.main .wrap{gap:4px 2px;row-gap:8px}.hbtn{padding:6px 5px;gap:3px}.logo b{font-size:1.15rem}.logo small{font-size:.56rem}.logo img{width:40px;height:40px}.logo{margin-right:auto}}
@media (max-width:380px){.logo small{display:none}}
/* header: search bar never collapses */
.search{min-width:240px}
@media (max-width:1180px){.hbtn .lbl{display:none}.hbtn{padding:6px}}
@media (max-width:900px){header.main .wrap{flex-wrap:wrap}.search{order:5;flex-basis:100%;min-width:0}.search select{display:none}.logo{margin-right:auto}}

}

/* ================= cart & checkout ================= */
function cartGroups(){
 const g={};
 S.cart=S.cart.filter(c=>getProd(c.pid));
 S.cart.forEach((c,idx)=>{const p=getProd(c.pid);(g[p.storeId]=g[p.storeId]||[]).push({...c,idx,p,unit:priceOf(p,c.vi??-1).now})});
 return Object.entries(g).map(([sid,items])=>{
  const sub=items.reduce((a,x)=>a+x.unit*x.qty,0);
  const st=getStore(sid); const s=S.settings.ship;
  let opts=["dhaka","outside","pickup","negotiated"].filter(k=>s[k].on&&items.every(x=>x.p.ship[k])&&(k!=="pickup"||st.pickup)); if(!opts.length) opts=["negotiated"];
  const sel=opts.includes(UI.ship[sid])?UI.ship[sid]:opts[0]; UI.ship[sid]=sel;
  const fee=sel==="negotiated"||sel==="pickup"?0:s[sel].fee;
  let disc=0,cErr=""; const code=UI.coupons[sid];
  if(code){const c=S.coupons.find(x=>x.storeId===sid&&x.code.toUpperCase()===code.toUpperCase()&&x.active&&x.expires>=today()&&x.used<x.limit);
   if(!c) cErr=t("coupon_bad"); else if(sub<c.min) cErr=t("coupon_min",{m:money(c.min)}); else disc=c.type==="pct"?Math.round(sub*c.value/100):Math.min(c.value,sub);}
  const gift=giftFor(sid,sub,items.map(x=>x.p.id));
  return {sid,st,items,sub,opts,sel,fee,disc,cErr,code,gift,total:sub-disc+fee};
 });
}

   ${os.map(o=>{const s=getStore(o.storeId);const wa=String(s.whatsapp).replace(/\D/g,"").replace(/^0/,"880");return `<tr><td class="num"><b>${esc(o.no)}</b></td><td>${fmtDate(o.created)}</td><td><button class="btn ghost sm" style="padding:0" data-go="store:${s.id}">${esc(L(s,"name"))}</button></td><td class="small">${o.items.map(i=>N(i.qty)+" × "+esc(L(i,"title"))).join("<br>")}</td><td class="num">${money(o.total)}</td><td>${stPill(o.status)}</td><td><div class="row" style="gap:4px"><a class="btn sm" href="tel:${s.phone}">${t("call")}</a><a class="btn sm" href="https://wa.me/${wa}" target="_blank" rel="noopener">${t("whatsapp")}</a></div><div class="tiny muted num">${s.phone}</div></td></tr>`}).join("")}</tbody></table></div>`:`<div class="card empty">${t("no_items")}<button class="btn pri" data-go="home">${t("continue_shop")}</button></div>`}</div>`;

<script>
/* ================= dashboard shell ================= */
function dashShell(kind,tabs,cur,who,body){
 return `<div class="wrap"><div class="dash"><nav class="card side-nav" aria-label="${kind}">${who}
  ${tabs.map(([k,ic,lbl,badge])=>`<button data-go="${kind}:${k}" aria-current="${cur===k?"page":"false"}">${icon(ic)}<span>${lbl}</span>${badge?`<span class="badge num">${N(badge)}</span>`:""}</button>`).join("")}</nav>
  <main class="stack" style="gap:16px;min-width:0">${body}</main></div></div>`;
}
const lsPill=p=>`<span class="pill ${p.status==="approved"?"g":p.status==="rejected"?"r":"y"}">${t("ls_"+p.status)}</span>`;
function fsPill(p){
 if(!p.featured) return `<span class="pill">${t("free_listing")}</span>`;
 if(p.featured==="active"&&p.featuredUntil>Date.now()) return `<span class="pill solid-r">${t("fs_active",{d:fmtShort(p.featuredUntil)})}</span>`;
 if(p.featured==="active") return `<span class="pill">${t("fs_expired")}</span>`;
 return `<span class="pill ${p.featured==="awaiting_payment"?"r":"y"}">${t("fs_"+p.featured)}</span>`;
}
const thumb=p=>`<div class="thumb">${pimg(p)}</div>`;
const kpi=(v,l,alert)=>`<div class="card kpi ${alert?"alert":""}"><span class="v">${v}</span><span class="l">${l}</span></div>`;
const validOrders=o=>o.status!=="cancelled";

/* ================= seller ================= */
function viewSeller(){
 const u=me(); if(!u) return viewLogin(t("need_login"));
 if(u.role!=="seller") return `<div class="wrap"><div class="card empty" style="margin-top:20px">${t("need_seller")}</div></div>`;
 const s=myStore(); const tab=R.p.tab||"overview";
 const prods=S.products.filter(p=>p.storeId===s.id);
 const ords=S.orders.filter(o=>o.storeId===s.id);
 const open=ords.filter(o=>["pending","confirmed","packed"].includes(o.status)).length;
 const unpaid=prods.filter(p=>p.featured==="awaiting_payment").length;
 const tabs=[["overview","grid",t("overview")],["products","box",t("products"),unpaid],["add","plus",t("add_product")],["orders","receipt",t("orders"),open],["coupons","tag",t("coupons")],["gifts","gift",t("gifts")],["reports","chart",t("reports")],["ads","megaphone",t("advertising")],["payments","wallet",t("payments")],["setup","store",t("shop_setup")]];
 const who=`<div class="who">${logoHTML(s)}<div style="min-width:0"><b class="small" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(L(s,"name"))}</b><button class="btn ghost sm" style="padding:0" data-go="store:${s.id}">${t("view_shop")} →</button></div></div>`;
 const views={overview:sOverview,products:sProducts,add:sAddProduct,orders:sOrders,coupons:sCoupons,gifts:sGifts,reports:sReports,ads:sAds,payments:sPayments,setup:sSetup};
 return dashShell("seller",tabs,tab,who,(views[tab]||sOverview)(s,prods,ords));
}
function sOverview(s,prods,ords){
 const t0=startOfDay(Date.now()); const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);
 const todayRev=ords.filter(o=>o.created>=t0&&validOrders(o)).reduce((a,o)=>a+o.total,0);
 const monthRev=ords.filter(o=>o.created>=m0.getTime()&&validOrders(o)).reduce((a,o)=>a+o.total,0);
 const open=ords.filter(o=>["pending","confirmed","packed"].includes(o.status));
 const live=prods.filter(isLive).length, pend=prods.filter(p=>p.status==="pending").length;
 const att=[];
 prods.filter(p=>p.featured==="awaiting_payment").forEach(p=>att.push(`<div class="row between"><span class="small">${esc(L(p,"title"))} · ${fsPill(p)}${p.payNote?`<div class="tiny" style="color:var(--red)">${t("pay_rejected",{t:esc(p.payNote)})}</div>`:""}</span><button class="btn sm red" data-act="payFee" data-id="${p.id}">${t("pay_fee")}</button></div>`));
 prods.filter(p=>p.status==="rejected").forEach(p=>att.push(`<div class="row between"><span class="small">${esc(L(p,"title"))} · ${lsPill(p)}<div class="tiny muted">${t("rejected_note",{r:esc(p.rejectReason||"—")})}</div></span><button class="btn sm" data-go="seller:add" data-id="${p.id}">${t("edit")}</button></div>`));
 open.filter(o=>o.status==="pending").slice(0,3).forEach(o=>att.push(`<div class="row between"><span class="small num">${esc(o.no)} · ${esc(o.customer.name)} · ${money(o.total)}</span><button class="btn sm" data-go="seller:orders">${t("orders")}</button></div>`));
 const recent=[...ords].sort((a,b)=>b.created-a.created).slice(0,6);
 return `<div class="panelhead"><h1>${t("overview")}</h1><button class="btn pri" data-go="seller:add">${icon("plus","").replace('class=""','style="width:16px;height:16px"')} ${t("add_product")}</button></div>
 <div class="kpis">${kpi(money(todayRev),t("today_sales"))}${kpi(money(monthRev),t("month_sales"))}${kpi(N(open.length),t("open_orders"),open.length>0)}${kpi(N(live)+(pend?` <span class="small muted">+${N(pend)}</span>`:""),t("live_products")+(pend?" · "+t("awaiting_approval"):""))}</div>
 ${att.length?`<div class="card pad stack"><h3>${t("needs_attention")}</h3>${att.join('<div class="hr"></div>')}</div>`:""}
 <div class="card pad"><div class="panelhead"><h3>${t("reports")} · ${t("daily")}</h3><button class="btn sm ghost" data-go="seller:reports">${t("view_all")} →</button></div>${barChart(buckets(ords,"daily"))}</div>
 <div><div class="panelhead"><h3>${t("recent_orders")}</h3><button class="btn sm ghost" data-go="seller:orders">${t("view_all")} →</button></div>${orderTable(recent,false)}</div>`;
}
function sProducts(s,prods){
 const f=UI.prodFilter;
 const list=prods.filter(p=>f==="all"||(f==="live"&&isLive(p))||(f==="pending"&&p.status==="pending")||(f==="featured"&&p.featured)||(f==="rejected"&&p.status==="rejected")).sort((a,b)=>b.created-a.created);
 return `<div class="panelhead"><h1>${t("products")}</h1><button class="btn pri" data-go="seller:add">${t("add_product")}</button></div>
 <div class="tabs" role="group">${[["all","all"],["live","ls_approved"],["pending","ls_pending"],["featured","featured"],["rejected","ls_rejected"]].map(([k,l])=>`<button data-act="prodFilter" data-f="${k}" aria-pressed="${f===k}">${t(l)}</button>`).join("")}</div>
 <div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>${t("products")}</th><th>${t("price")}</th><th>${t("stock")}</th><th>${t("status")}</th><th>${t("listing")}</th><th>${t("actions")}</th></tr></thead><tbody>
 ${list.map(p=>`<tr><td>${thumb(p)}</td><td style="min-width:200px"><b class="small">${esc(L(p,"title"))}</b><div class="tiny muted">${p.condition==="used"?t("pre_owned"):t("brand_new")} · ${esc(L(getCat(p.catId),"name"))}${dealToday(p)?" · "+t("deals"):""}</div>${p.status==="rejected"?`<div class="tiny" style="color:var(--red)">${t("rejected_note",{r:esc(p.rejectReason||"—")})}</div>`:""}${p.payNote&&p.featured==="awaiting_payment"?`<div class="tiny" style="color:var(--red)">${t("pay_rejected",{t:esc(p.payNote)})}</div>`:""}</td>
  <td class="num">${priceHTML(p,-1)}</td><td class="num">${N(p.type==="variable"?p.variations.reduce((a,v)=>a+ +v.stock,0):p.stock)}</td><td>${lsPill(p)}</td><td>${fsPill(p)}</td>
  <td><div class="row" style="gap:4px;flex-wrap:nowrap">
   ${p.featured==="awaiting_payment"?`<button class="btn sm red" data-act="payFee" data-id="${p.id}">${t("pay_fee")}</button>`:""}
   ${(!p.featured||(p.featured==="active"&&p.featuredUntil<Date.now()))&&p.status!=="rejected"?`<button class="btn sm" data-act="makeFeatured" data-id="${p.id}">${p.featured?t("renew"):t("make_featured")}</button>`:""}
   <button class="btn sm" data-go="seller:add" data-id="${p.id}">${t("edit")}</button>
   <button class="btn sm ghost" data-act="delProduct" data-id="${p.id}" style="color:var(--red)">${UI.confirmDel===p.id?t("delete")+"?":t("delete")}</button></div></td></tr>`).join("")||`<tr><td colspan="7"><div class="empty">${t("no_items")}</div></td></tr>`}
 </tbody></table></div>`;
}
function sAddProduct(s,prods){
 const p=R.p.id?getProd(R.p.id):null; const key=p?p.id:"new";
 if(UI.editFor!==key){UI.editFor=key;UI.editImgs=p?[...p.images]:[];UI.editVars=p?JSON.parse(JSON.stringify(p.variations||[])):[];UI.editType=p?p.type:"simple";}
 const st=S.settings; const tops=S.categories.filter(c=>!c.parent);
 const v=(f,d="")=>esc(p?p[f]??d:d);
 const allowVar=st.allowVariable;
 const gifts=S.gifts.filter(g=>g.storeId===s.id&&g.active);
 return `<div class="panelhead"><h1>${p?t("edit_product"):t("add_product")}</h1>${p?`<div class="row">${lsPill(p)}${fsPill(p)}</div>`:""}</div>
 <form class="stack" data-form="product" data-id="${p?p.id:""}">
 <div class="card pad stack">
  <div class="grid2"><label class="field"><span>${t("title_en")} *</span><input id="pf_ten" name="title_en" required value="${v("title_en")}"></label><label class="field"><span>${t("title_bn")}</span><input id="pf_tbn" name="title_bn" value="${v("title_bn")}" lang="bn"></label></div>
  <div class="grid2"><label class="field"><span>${t("desc_en")}</span><textarea id="pf_den" name="desc_en">${v("desc_en")}</textarea></label><label class="field"><span>${t("desc_bn")}</span><textarea id="pf_dbn" name="desc_bn" lang="bn">${v("desc_bn")}</textarea></label></div>
  <div class="grid3"><label class="field"><span>${t("category")} *</span><select id="pf_cat" name="catId" required>${tops.map(c=>`<optgroup label="${esc(L(c,"name"))}">${S.categories.filter(x=>x.parent===c.id).map(x=>`<option value="${x.id}" ${p&&p.catId===x.id?"selected":""}>${esc(L(x,"name"))}</option>`).join("")||`<option value="${c.id}">${esc(L(c,"name"))}</option>`}</optgroup>`).join("")}</select></label>
   <label class="field"><span>${t("brand")}</span><select id="pf_brand" name="brandId">${S.brands.map(b=>`<option value="${b.id}" ${p&&p.brandId===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}</select></label>
   <label class="field"><span>${t("condition")}</span><select id="pf_cond" name="condition"><option value="new" ${p?.condition==="new"?"selected":""}>${t("brand_new")}</option><option value="used" ${p?.condition==="used"?"selected":""}>${t("pre_owned")}</option></select></label></div>
 </div>
 <div class="card pad stack"><b class="small">${t("product_type")}</b>
  <div class="radiocards"><label><input type="radio" name="type" value="simple" ${UI.editType==="simple"?"checked":""} data-change="editType"><span><b>${t("simple")}</b><div class="tiny muted">${t("simple_s")}</div></span></label>
   <label class="${allowVar?"":"dis"}"><input type="radio" name="type" value="variable" ${UI.editType==="variable"?"checked":""} ${allowVar?"":"disabled"} data-change="editType"><span><b>${t("variable")}</b><div class="tiny muted">${allowVar?t("variable_s"):t("variable_locked")}</div></span></label></div>
  ${UI.editType==="variable"&&allowVar?`<div class="stack" style="gap:6px"><b class="small">${t("variations")}</b>${UI.editVars.map((x,i)=>`<div class="grid3"><input class="inp" data-var="${i}" data-k="label" value="${esc(x.label)}" placeholder="${t("var_label")}" aria-label="${t("var_label")}"><input class="inp" type="number" min="0" data-var="${i}" data-k="price" value="${esc(x.price)}" placeholder="${t("price")}" aria-label="${t("price")}"><div class="row" style="flex-wrap:nowrap"><input class="inp" type="number" min="0" data-var="${i}" data-k="stock" value="${esc(x.stock)}" placeholder="${t("stock")}" aria-label="${t("stock")}"><button type="button" class="btn sm ghost" data-act="delVar" data-i="${i}">✕</button></div></div>`).join("")}<button type="button" class="btn sm" data-act="addVar" style="align-self:flex-start">+ ${t("add_variation")}</button></div>`:
  `<div class="grid3"><label class="field"><span>${t("regular_price")} *</span><input id="pf_price" name="price" type="number" min="1" required value="${v("price")}"></label><label class="field"><span>${t("sale_price")}</span><input id="pf_sale" name="sale" type="number" min="0" value="${p&&p.sale?p.sale:""}"></label><label class="field"><span>${t("stock")} *</span><input id="pf_stock" name="stock" type="number" min="0" required value="${v("stock","10")}"></label></div>
  <label class="check"><input type="checkbox" name="deal" id="pf_deal" ${p&&p.deal?"checked":""}> ${t("deal_day")}</label>
  <div class="grid3"><label class="field"><span>${t("deal_price")}</span><input id="pf_dprice" name="deal_price" type="number" min="0" value="${p&&p.deal?p.deal.price:""}"></label><label class="field"><span>${t("deal_date")}</span><input id="pf_ddate" name="deal_date" type="date" value="${p&&p.deal?p.deal.date:today()}"></label><label class="field"><span>${t("sku")}</span><input id="pf_sku" name="sku" value="${v("sku","RGB-"+Math.floor(Math.random()*9000+1000))}"></label></div>`}
 </div>
 <div class="card pad stack"><b class="small">${t("images")}</b>
  <div class="upl">${UI.editImgs.map((src,i)=>`<div class="ph"><img src="${src}" alt=""><button type="button" data-act="delImg" data-i="${i}" aria-label="${t("remove")}">✕</button></div>`).join("")}${UI.editImgs.length<4?`<label>${t("add_photo")}<input type="file" accept="image/*" data-change="addImg" multiple></label>`:""}</div>
  <b class="small">${t("attributes")}</b><div class="grid2">${S.attributes.map(a=>`<label class="field"><span>${esc(L(a,"name"))}</span><select name="attr_${a.id}" id="pf_attr_${a.id}"><option value="">${t("none")}</option>${a.values.split(",").map(x=>x.trim()).filter(Boolean).map(x=>`<option ${p&&p.attrs?.[a.id]===x?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`).join("")}</div>
 </div>
 <div class="card pad stack"><b class="small">${t("ship_opts")}</b><div class="row" style="gap:16px">${["dhaka","outside","pickup","negotiated"].filter(k=>st.ship[k].on).map(k=>`<label class="check"><input type="checkbox" name="ship_${k}" ${!p||p.ship[k]?"checked":""}> ${t("ship_"+k)} <span class="tiny muted num">${k==="negotiated"?"":st.ship[k].fee?money(st.ship[k].fee):t("free")}</span></label>`).join("")}</div>
  ${gifts.length?`<label class="field"><span>${t("attach_gift")}</span><select name="giftId" id="pf_gift"><option value="">${t("none")}</option>${gifts.map(g=>`<option value="${g.id}" ${p&&p.giftId===g.id?"selected":""}>${esc(L(g,"name"))}</option>`).join("")}</select></label>`:""}
 </div>
 ${!p||!p.featured?`<div class="card pad stack"><b class="small">${t("listing_type")}</b><div class="radiocards">
  <label><input type="radio" name="listing" value="free" checked><span><b>${t("free_listing")}</b><div class="tiny muted">${t("free_s")}</div></span></label>
  <label><input type="radio" name="listing" value="featured"><span><b>${t("featured_listing")} · ${money(st.featuredFee)}</b><div class="tiny muted">${t("featured_s",{f:money(st.featuredFee),d:N(st.featuredDays)})}</div></span></label></div></div>`:""}
 <div class="row"><button class="btn pri">${p?t("save"):t("submit_review")}</button><button type="button" class="btn" data-go="seller:products">${t("cancel")}</button></div>
 </form>`;
}
function orderTable(list,full){
 if(!list.length) return `<div class="card empty">${t("no_items")}</div>`;
 return `<div class="tblwrap"><table class="tbl"><thead><tr><th>${t("order_no")}</th><th>${t("date")}</th><th>${t("customer_col")}</th><th>${t("items")}</th><th>${t("ship_method")}</th><th>${t("total")}</th><th>${t("status")}</th>${full?`<th>${t("actions")}</th>`:""}</tr></thead><tbody>
 ${list.map(o=>`<tr><td class="num"><b>${esc(o.no)}</b><div class="tiny muted">${o.pay==="cod"?t("cod"):esc(o.pay)}${o.trx?" · "+esc(o.trx):""}</div></td><td class="small">${fmtDate(o.created)}</td><td class="small">${esc(o.customer.name)}<div class="tiny muted num">${esc(o.customer.phone)} · ${esc(o.customer.district)}</div></td>
  <td class="small">${o.items.map(i=>N(i.qty)+" × "+esc(L(i,"title"))).join("<br>")}${o.gift?`<div class="tiny" style="color:var(--green)">+ ${esc(L(o.gift,"name"))}</div>`:""}</td><td class="small">${t("ship_"+o.method)}</td><td class="num">${money(o.total)}</td>
  <td>${full?`<select class="inp" style="width:auto;padding:5px 8px" data-change="orderStatus" data-id="${o.id}" aria-label="${t("update_status")}">${["pending","confirmed","packed","shipped","delivered","cancelled"].map(s=>`<option value="${s}" ${o.status===s?"selected":""}>${t("st_"+s)}</option>`).join("")}</select>`:stPill(o.status)}</td>
  ${full?`<td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm" data-act="doc" data-k="invoice" data-id="${o.id}">${t("invoice")}</button><button class="btn sm" data-act="doc" data-k="packing" data-id="${o.id}">${t("packing")}</button><button class="btn sm" data-act="doc" data-k="label" data-id="${o.id}">${t("label")}</button></div></td>`:""}</tr>`).join("")}</tbody></table></div>`;
}
function sOrders(s,prods,ords){
 const f=UI.ordFilter; const list=ords.filter(o=>f==="all"||o.status===f).sort((a,b)=>b.created-a.created).slice(0,60);
 return `<div class="panelhead"><h1>${t("orders")}</h1></div>
 <div class="tabs" role="group">${["all","pending","confirmed","packed","shipped","delivered","cancelled"].map(k=>`<button data-act="ordFilter" data-f="${k}" aria-pressed="${f===k}">${k==="all"?t("all"):t("st_"+k)} <span class="tiny num">${N(k==="all"?ords.length:ords.filter(o=>o.status===k).length)}</span></button>`).join("")}</div>
 ${orderTable(list,true)}`;

function buckets(ords,mode){
 const out=[]; const now=Date.now(); const v=ords.filter(validOrders);
 const sum=(a,b)=>{const os=v.filter(o=>o.created>=a&&o.created<b);return {rev:os.reduce((x,o)=>x+o.total,0),n:os.length,units:os.reduce((x,o)=>x+o.items.reduce((y,i)=>y+i.qty,0),0)}};
 if(mode==="daily"){for(let i=13;i>=0;i--){const a=startOfDay(now-i*DAY);out.push({label:fmtShort(a),...sum(a,a+DAY)})}}
 else if(mode==="weekly"){const d0=startOfDay(now);const dow=(new Date(d0).getDay()+1)%7;/* week starts Saturday */const ws=d0-dow*DAY;for(let i=11;i>=0;i--){const a=ws-i*7*DAY;out.push({label:fmtShort(a),...sum(a,a+7*DAY)})}}
 else {const d=new Date();d.setDate(1);d.setHours(0,0,0,0);for(let i=11;i>=0;i--){const a=new Date(d.getFullYear(),d.getMonth()-i,1).getTime();const b=new Date(d.getFullYear(),d.getMonth()-i+1,1).getTime();out.push({label:new Date(a).toLocaleDateString(S.lang==="bn"?"bn-BD":"en-GB",{month:"short",year:"2-digit"}),...sum(a,b)})}}
 return out;
}
function barChart(b){
 const W=640,H=200,pl=48,pb=26,pt=12; const max=Math.max(1,...b.map(x=>x.rev)); const nice=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/nice)*nice;
 const bw=(W-pl-8)/b.length; const y=v=>pt+(H-pt-pb)*(1-v/top);
 const ticks=[0,.5,1].map(f=>top*f);
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("revenue")}">
  ${ticks.map(v=>`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v>=1000?N(Math.round(v/1000))+"k":N(Math.round(v))}</text>`).join("")}
  ${b.map((x,i)=>`<rect x="${pl+i*bw+bw*.18}" y="${y(x.rev)}" width="${bw*.64}" height="${Math.max(0,H-pb-y(x.rev))}" rx="3" fill="${i===b.length-1?"var(--red)":"var(--green)"}"><title>${x.label}: ${money(x.rev)} · ${N(x.n)}</title></rect>${(b.length<=14||i%2===0)?`<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${x.label}</text>`:""}`).join("")}
 </svg></div>`;
}
function sReports(s,prods,ords){

 const since=m==="daily"?startOfDay(Date.now()-13*DAY):m==="weekly"?Date.now()-84*DAY:Date.now()-365*DAY;
 const best={}; ords.filter(o=>validOrders(o)&&o.created>=since).forEach(o=>o.items.forEach(i=>{best[i.pid]=best[i.pid]||{q:0,r:0,i};best[i.pid].q+=i.qty;best[i.pid].r+=i.qty*i.price}));

function render(keep){
 let snap=null;
 if(keep){snap={};document.querySelectorAll("#app input,#app select,#app textarea").forEach(el=>{const k=el.id||(el.name&&(el.type==="radio"||el.type==="checkbox")?el.name+"="+el.value:el.name);if(!k||el.type==="file")return;snap[k]=(el.type==="radio"||el.type==="checkbox")?{c:el.checked}:{v:el.value}})}
 document.documentElement.lang=S.lang==="bn"?"bn":"en";
 const V={wishlist:viewWishlist,home:viewHome,catalog:viewCatalog,product:viewProduct,store:viewStore,cart:viewCart,checkout:viewCheckout,done:viewDone,account:viewAccount,login:()=>viewLogin(),register:viewRegister,seller:viewSeller,admin:viewAdmin};
 $("#app").innerHTML=header()+(V[R.v]||viewHome)()+footer();
 if(snap){document.querySelectorAll("#app input,#app select,#app textarea").forEach(el=>{const k=el.id||(el.name&&(el.type==="radio"||el.type==="checkbox")?el.name+"="+el.value:el.name);const s=snap[k];if(!s||el.type==="file")return;if("c" in s){if(!el.dataset.change)el.checked=s.c}else if(el.tagName!=="SELECT"||!el.dataset.change)el.value=s.v})}

function tick(){
 const el=document.getElementById("cd"); if(!el) return;
 const end=startOfDay(Date.now())+DAY; let s=Math.max(0,Math.floor((end-Date.now())/1000));
 const h=String(Math.floor(s/3600)).padStart(2,"0"),m=String(Math.floor(s%3600/60)).padStart(2,"0"),sec=String(s%60).padStart(2,"0");
 el.textContent=N(`${h}:${m}:${sec}`);
}
function readImg(file,max=640,png){
 return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.82))};im.src=fr.result};fr.readAsDataURL(file)});
}

 delCat:d=>{const used=S.products.some(p=>p.catId===d.id||getCat(p.catId)?.parent===d.id);if(used){toast(S.lang==="bn"?"এই ক্যাটাগরিতে পণ্য আছে, আগে সেগুলো সরান।":"This category has products. Move them first.");return}S.categories=S.categories.filter(c=>c.id!==d.id&&c.parent!==d.id);save();render()},
 delBrand:d=>{S.brands=S.brands.filter(b=>b.id!==d.id);save();render()},
 delAttr:d=>{S.attributes=S.attributes.filter(a=>a.id!==d.id);save();render()},
 toggleAd:d=>{const a=S.ads.find(x=>x.id===d.id);a.active=!a.active;save();render()},
 delAd:d=>{S.ads=S.ads.filter(x=>x.id!==d.id);save();render()},
 clearPayLogo:d=>{S.settings.mfs[+d.i].logo=null;save();render(true)},
 delPay:d=>{const m=S.settings.mfs;if(m[+d.i].on&&m.filter(x=>x.on).length<=1){toast(t("method_in_use"));return}m.splice(+d.i,1);save();render();toast(t("deleted"))},
 clearLogo:()=>{S.settings.logo=null;save();render()},
};
const CHG={
 demoRole:el=>{const r=el.value;if(r==="guest"){S.userId=null;save();go("home");return}ACT.demoLogin({r})},
 sort:el=>{R.p.sort=el.value;R.p.page=1;render()},
 flt:el=>{const k=el.dataset.k;if(k==="sort"||k==="min"||k==="max")R.p[k]=el.value;else{const a=[...(R.p[k]||[])];const i=a.indexOf(el.value);if(el.checked&&i<0)a.push(el.value);if(!el.checked&&i>=0)a.splice(i,1);R.p[k]=a}R.p.page=1;render()},
 pdpVar:el=>{UI.pdpVar=+el.value;render()},
 ship:el=>{UI.ship[el.dataset.s]=el.value;render(true)},
 pay:el=>{UI.pay=el.value;render(true)},
 regRole:el=>{R.p.role=el.value;render(true)},
 editType:el=>{UI.editType=el.value;if(el.value==="variable"&&!UI.editVars.length)UI.editVars.push({label:"",price:"",stock:""});render(true)},
 addImg:async el=>{for(const f of [...el.files].slice(0,4-UI.editImgs.length)){try{UI.editImgs.push(await readImg(f))}catch(e){toast(t("img_big"))}}render(true)},
 storeImg:async el=>{const f=el.files[0];if(!f)return;try{const s=myStore();s[el.dataset.k]=await readImg(f,el.dataset.k==="banner"?1400:400);save();render(true);toast(t("saved"))}catch(e){toast(t("img_big"))}},
 siteLogo:async el=>{const f=el.files[0];if(!f)return;try{S.settings.logo=await readImg(f,400);save();render();toast(t("saved"))}catch(e){toast(t("img_big"))}},
 orderStatus:el=>{const o=S.orders.find(x=>x.id===el.dataset.id);o.status=el.value;save();toast(t("status_updated"))},
 secOn:el=>{S.settings.home.sections[+el.dataset.i].on=el.checked;save();toast(t("saved"))},
 secMax:el=>{S.settings.home.sections[+el.dataset.i].max=Math.max(2,+el.value||10);save();toast(t("saved"))},
 slideField:el=>{S.settings.home.slides[+el.dataset.i][el.dataset.k]=el.value;save();render(true);toast(t("saved"))},
 menuField:el=>{S.settings.menu[+el.dataset.i][el.dataset.k]=el.value;save();render(true);toast(t("saved"))},
 menuHot:el=>{S.settings.menu[+el.dataset.i].hot=el.checked;save();render(true)},
 catField:el=>{const c=getCat(el.dataset.id);c[el.dataset.k]=el.value;save();toast(t("saved"))},
 attrField:el=>{const a=S.attributes.find(x=>x.id===el.dataset.id);a[el.dataset.k]=el.value;save();toast(t("saved"))},
 setNum:el=>{S.settings[el.dataset.k]=Math.max(0,+el.value||0);save();toast(t("saved"))},
 setStr:el=>{S.settings[el.dataset.k]=el.value;save();toast(t("saved"))},
 setVar:el=>{S.settings.allowVariable=el.checked;save();toast(t("saved"))},
 shipSet:el=>{const s=S.settings.ship[el.dataset.k];const f=el.dataset.f;s[f]=f==="on"?el.checked:f==="fee"?Math.max(0,+el.value||0):el.value;save();toast(t("saved"))},
 mfsSet:el=>{const m=S.settings.mfs[+el.dataset.i];if(el.dataset.f==="on")m.on=el.checked;else m.number=el.value;save();toast(t("saved"))},
 adPrice:el=>{S.settings.adPrice[el.dataset.k]=Math.max(0,+el.value||0);save();toast(t("saved"))},
 mfsPick:()=>{},
 paySet:el=>{const m=S.settings.mfs[+el.dataset.i];const f=el.dataset.f;if(f==="on"){if(!el.checked&&S.settings.mfs.filter(x=>x.on).length<=1){el.checked=true;toast(t("method_in_use"));return}m.on=el.checked}else m[f]=el.value.trim?el.value.trim():el.value;save();render(true);toast(t("saved"))},
 payLogo:async el=>{const f=el.files[0];if(!f)return;try{S.settings.mfs[+el.dataset.i].logo=await readImg(f,240,true);save();render(true);toast(t("saved"))}catch(e){toast(t("img_big"))}},
};
const req=(fd,fields)=>{const miss=fields.filter(([k])=>!String(fd.get(k)||"").trim()).map(([,l])=>l);if(miss.length){toast(t("required",{f:miss.join(", ")}));return false}return true};
const FORMS={
 search:fd=>{const q=String(fd.get("q")||"").trim();R={v:"catalog",p:{q,cat:fd.get("cat")||""}};render();window.scrollTo(0,0)},
 filters:fd=>{R.p={...R.p,cond:fd.get("cond")||"",min:fd.get("min")||"",max:fd.get("max")||"",brand:fd.get("brand")||"",page:1};render()},
 storeSearch:fd=>{R.p.q=String(fd.get("q")||"");render()},
 coupon:(fd,f)=>{UI.coupons[f.dataset.s]=String(fd.get("code")||"").trim();render(true)},
 login:fd=>{const id=String(fd.get("id")).trim().toLowerCase(),pw=String(fd.get("pw"));const u=S.users.find(x=>(x.email.toLowerCase()===id||x.phone===id)&&x.pass===pw);
  if(!u){$("#loginErr").innerHTML=`<div class="note r small">${t("bad_login")}</div>`;return}S.userId=u.id;save();go(u.role==="seller"?"seller:overview":u.role==="admin"?"admin:overview":"home")},
 register:fd=>{const email=String(fd.get("email")).trim().toLowerCase(),phone=String(fd.get("phone")).trim();
  if(S.users.some(u=>u.email.toLowerCase()===email||u.phone===phone)){$("#regErr").innerHTML=`<div class="note r small">${t("email_taken")}</div>`;return}
  const u={id:uid("u"),name:String(fd.get("name")).trim(),email,phone,pass:String(fd.get("pw")),role:fd.get("role")};
  if(u.role==="seller"){const s={id:uid("s"),ownerId:u.id,name_en:String(fd.get("shop_en")).trim(),name_bn:String(fd.get("shop_bn")||"").trim(),color:"#006A4E",address:"",district:String(fd.get("district")||"Dhaka"),phone,email,whatsapp:phone,about_en:"",about_bn:"",logo:null,banner:null,pickup:false,hours_en:"",hours_bn:"",returns_en:"",returns_bn:"",mfs:"",created:Date.now(),suspended:false};S.stores.push(s);u.storeId=s.id}
  S.users.push(u);S.userId=u.id;save();if(u.role==="seller"){go("seller:setup");toast(t("welcome_seller"))}else go("home")},
 checkout:fd=>{
  if(mfsOn().some(m=>m.id===UI.pay)&&!String(fd.get("trx")||"").trim()){toast(t("trx_need"));return}
  const G=cartGroups(); const u=me(); UI.lastOrders=[]; let no=Math.max(...S.orders.map(o=>+o.no.split("-")[1]))+1;
  G.forEach(g=>{const id="o"+no;const coupon=g.disc?S.coupons.find(c=>c.storeId===g.sid&&c.code.toUpperCase()===g.code.toUpperCase()):null;if(coupon)coupon.used++;if(g.gift)g.gift.stock--;
   g.items.forEach(x=>{if(x.p.type==="variable"&&x.vi>=0)x.p.variations[x.vi].stock=Math.max(0,x.p.variations[x.vi].stock-x.qty);else x.p.stock=Math.max(0,x.p.stock-x.qty);x.p.sold+=x.qty});
   S.orders.push({id,no:"RGB-"+no,storeId:g.sid,customerId:u?.id||null,customer:{name:fd.get("name"),phone:fd.get("phone"),email:fd.get("email"),address:fd.get("address"),district:fd.get("district")},
    items:g.items.map(x=>({pid:x.p.id,title_en:x.p.title_en+(x.vi>=0&&x.p.variations?.[x.vi]?" ("+x.p.variations[x.vi].label+")":""),title_bn:(x.p.title_bn||x.p.title_en)+(x.vi>=0&&x.p.variations?.[x.vi]?" ("+x.p.variations[x.vi].label+")":""),qty:x.qty,price:x.unit})),
    method:g.sel,fee:g.fee,discount:g.disc,coupon:coupon?coupon.code:null,gift:g.gift?{name_en:g.gift.name_en,name_bn:g.gift.name_bn}:null,pay:UI.pay,trx:String(fd.get("trx")||"").toUpperCase(),subtotal:g.sub,total:g.total,status:"pending",created:Date.now(),note:fd.get("note")||""});
   UI.lastOrders.push(id);no++});
  S.cart=[];UI.coupons={};save();go("done")},
 product:(fd,f)=>{
  const editing=f.dataset.id?getProd(f.dataset.id):null; const s=myStore(); const type=UI.editType==="variable"&&S.settings.allowVariable?"variable":"simple";
  if(!req(fd,[["title_en",t("title_en")]]))return;
  if(type==="simple"&&!req(fd,[["price",t("regular_price")],["stock",t("stock")]]))return;
  const vars=UI.editVars.filter(v=>String(v.label).trim()&&+v.price>0).map(v=>({label:String(v.label).trim(),price:+v.price,stock:+v.stock||0}));
  if(type==="variable"&&!vars.length){toast(t("required",{f:t("variations")}));return}
  const p=editing||{id:uid("p"),storeId:s.id,rating:0,reviews:0,sold:0,created:Date.now(),approvedAt:null,tone:Math.floor(Math.random()*6),featured:null,featuredUntil:null,listing:"free"};
  Object.assign(p,{title_en:String(fd.get("title_en")).trim(),title_bn:String(fd.get("title_bn")||"").trim(),desc_en:String(fd.get("desc_en")||""),desc_bn:String(fd.get("desc_bn")||""),catId:fd.get("catId"),brandId:fd.get("brandId"),condition:fd.get("condition"),type,
   price:type==="variable"?Math.min(...vars.map(v=>v.price)):+fd.get("price"),sale:type==="simple"?(+fd.get("sale")||0):0,stock:type==="simple"?(+fd.get("stock")||0):0,variations:type==="variable"?vars:[],
   deal:type==="simple"&&fd.get("deal")&&+fd.get("deal_price")>0?{price:+fd.get("deal_price"),date:fd.get("deal_date")||today()}:null,sku:String(fd.get("sku")||p.sku||""),images:[...UI.editImgs],
   ship:{dhaka:!!fd.get("ship_dhaka"),outside:!!fd.get("ship_outside"),pickup:!!fd.get("ship_pickup"),negotiated:!!fd.get("ship_negotiated")},giftId:fd.get("giftId")||null,
   attrs:Object.fromEntries(S.attributes.map(a=>[a.id,fd.get("attr_"+a.id)||""])),status:"pending",rejectReason:null});
  const wantFeat=fd.get("listing")==="featured";
  if(wantFeat){p.listing="featured";p.featured="awaiting_payment";}
  if(!editing) S.products.push(p);
  UI.editFor=null; save(); go("seller:products"); toast(editing?t("prod_updated"):t("prod_saved"));
  if(wantFeat) payModal(p.id);
 },
 payFee:(fd,f)=>{const p=getProd(f.dataset.id);const trx=String(fd.get("trx")||"").trim().toUpperCase();if(!trx){toast(t("trx_need"));return}
  S.payments.push({id:uid("pay"),kind:"featured",refId:p.id,storeId:p.storeId,method:fd.get("method"),sender:String(fd.get("sender")),trx,amount:S.settings.featuredFee,at:Date.now(),status:"review"});
  p.featured="payment_review";p.payNote=null;save();closeModal();render();toast(t("pay_sent"))},
 coupon_new:fd=>{const s=myStore();const code=String(fd.get("code")).trim().toUpperCase();if(!code)return;S.coupons.push({id:uid("c"),storeId:s.id,code,type:fd.get("type"),value:+fd.get("value"),min:+fd.get("min")||0,expires:fd.get("expires"),limit:+fd.get("limit")||100,used:0,active:true});save();render();toast(t("coupon_made"))},
 gift_new:fd=>{const s=myStore();S.gifts.push({id:uid("g"),storeId:s.id,name_en:String(fd.get("name_en")).trim(),name_bn:String(fd.get("name_bn")||"").trim(),min:+fd.get("min")||0,scope:fd.get("scope"),stock:+fd.get("stock")||1,active:true});save();render();toast(t("gift_made"))},
 ad_book:fd=>{const s=myStore();const pl=fd.get("placement");const days=Math.max(1,+fd.get("days")||1);const amt=S.settings.adPrice[pl]*days;const trx=String(fd.get("trx")||"").trim().toUpperCase();if(!trx){toast(t("trx_need"));return}
  const r={id:uid("ar"),storeId:s.id,placement:pl,days,amount:amt,adId:null,status:"review",at:Date.now(),title_en:fd.get("title_en"),title_bn:fd.get("title_bn"),sub_en:fd.get("sub_en"),sub_bn:fd.get("sub_bn"),link:fd.get("link"),color:fd.get("color")};
  const pay={id:uid("pay"),kind:"ad",refId:r.id,storeId:s.id,method:fd.get("method"),sender:String(fd.get("sender")||s.phone),trx,amount:amt,at:Date.now(),status:"review"};r.payId=pay.id;
  S.adRequests.push(r);S.payments.push(pay);save();render();toast(t("ad_sent"))},
 setup:fd=>{const s=myStore();["name_en","name_bn","color","about_en","about_bn","phone","whatsapp","email","address","district","mfs","hours_en","hours_bn","returns_en","returns_bn"].forEach(k=>s[k]=String(fd.get(k)??""));s.pickup=!!fd.get("pickup");save();render();toast(t("saved"))},
 cat_new:fd=>{const par=fd.get("parent")||null;const base=String(fd.get("name_en")).toLowerCase().replace(/[^a-z]+/g,"").slice(0,6)||"cat";S.categories.push({id:(par?par+"-":"")+base+Math.random().toString(36).slice(2,4),name_en:String(fd.get("name_en")).trim(),name_bn:String(fd.get("name_bn")||"").trim(),parent:par,icon:fd.get("icon")});save();render();toast(t("saved"))},
 brand_new:fd=>{S.brands.push({id:uid("b"),name:String(fd.get("name")).trim()});save();render()},
 attr_new:fd=>{S.attributes.push({id:uid("a"),name_en:String(fd.get("name_en")).trim(),name_bn:String(fd.get("name_bn")||"").trim(),values:String(fd.get("values"))});save();render()},
 pay_new:fd=>{const id=String(fd.get("id")).trim();if(!id)return;S.settings.mfs.push({id,kind:fd.get("kind"),number:String(fd.get("number")||"").trim(),on:true,color:fd.get("color")||"#00802B",logo:null});save();render();toast(t("saved"))},
 ad_new:fd=>{S.ads.push({id:uid("ad"),placement:fd.get("placement"),title_en:fd.get("title_en"),title_bn:fd.get("title_bn"),sub_en:fd.get("sub_en"),sub_bn:fd.get("sub_bn"),cta_en:fd.get("cta_en"),cta_bn:fd.get("cta_bn"),link:fd.get("link"),color:fd.get("color"),start:fd.get("start"),end:fd.get("end"),active:true,storeId:null});save();render();toast(t("ad_made"))},
};

/* ================= events ================= */
document.addEventListener("click",ev=>{
 const a=ev.target.closest("[data-act],[data-go]"); if(!a) return;
 if(a.dataset.act){ const fn=ACT[a.dataset.act]; if(fn) fn(a.dataset,a,ev); return; }
 ev.preventDefault();closeModal();if(a.closest(".ddpanel"))UI.ddHold=true;const d=a.dataset;go(d.go,d.id?{id:d.id}:d.role?{role:d.role}:undefined);
});
document.addEventListener("change",ev=>{
 const el=ev.target;
 if(el.dataset.var!=null){UI.editVars[+el.dataset.var][el.dataset.k]=el.value;return}
 const fn=CHG[el.dataset.change]; if(fn) fn(el);
});
document.addEventListener("submit",ev=>{const f=ev.target.closest("form[data-form]");if(!f)return;ev.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(new FormData(f),f)});
document.addEventListener("mouseover",ev=>{if(UI.ddHold&&!ev.target.closest(".dd")){UI.ddHold=false;document.querySelector(".dd")?.classList.remove("hold")}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeModal();if(ev.key==="Enter"&&ev.target.matches&&ev.target.matches("div[data-go]"))ev.target.click()});
setInterval(tick,1000);
setInterval(()=>{const el=$("#slider");if(!el||el.matches(":hover")||document.hidden)return;UI.slide=(UI.slide+1)%Math.max(1,S.settings.home.slides.length);el.outerHTML=sliderHTML()},6500);

// deals stay "today" in the demo so the homepage always has a live Deals section
S.products.forEach(p=>{if(p.deal&&/^p\d+$/.test(p.id)&&p.deal.date<today())p.deal.date=today()});
const h=(location.hash||"").slice(1); if(["seller","admin","cart","login","register"].includes(h)){if(h==="seller")S.userId="u_s1";if(h==="admin")S.userId="u_admin";R={v:h,p:{}}}
render();
</script>
