<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00802B">
<title>No internet | RGBKart</title>
<style>
  body { margin: 0; font-family: "Roboto", "Hind Siliguri", system-ui, sans-serif; background: #F4F7F5; color: #14211C; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #00802B; border-bottom: 4px solid #F5C400; padding: 14px 16px; }
  header span { display: inline-flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 6px 16px 6px 6px; font: 700 1.1rem system-ui, sans-serif; }
  header img { width: 40px; height: 40px; }
  .r { color: #E30613; } .g { color: #00802B; } .y { color: #B88A00; } .d { color: #14211C; }
  main { flex: 1; display: grid; place-items: center; padding: 30px 16px; text-align: center; }
  h1 { font: 700 clamp(1.5rem, 4vw, 2rem) system-ui, sans-serif; margin: 10px 0; }
  p { color: #5A6A62; max-width: 44ch; margin: 0 auto 18px; line-height: 1.6; }
  .big { font-size: 4rem; }
  button { border: 0; border-radius: 999px; padding: 12px 26px; font: 700 1rem system-ui, sans-serif; background: #00802B; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<header><span><img src="assets/logo/rgb-basket-96.png" alt=""><span><span class="r">Red</span> <span class="d">&amp;</span> <span class="g">Green</span> <span class="y">Basket</span></span></span></header>
<main><div>
  <div class="big" aria-hidden="true">📶</div>
  <h1>No internet connection</h1>
  <p>RGBKart needs the internet. Check your Wi-Fi or mobile data, then try again.<br><span lang="bn">ইন্টারনেট সংযোগ নেই। Wi-Fi বা মোবাইল ডেটা চালু করে আবার চেষ্টা করুন।</span></p>
  <button type="button" onclick="location.reload()">Try again · আবার চেষ্টা করুন</button>
</div></main>
</body>
</html>
