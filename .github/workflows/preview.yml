# Preview of the DeshiBasket rebrand (1 Nov 2026): every push to the `deshibasket` branch uploads site/ to
# the folder preview/ on Hostinger, so the owner can browse https://deshibasket.com/preview/ (and
# rgbkart.com/preview/) before switch day. The live site in the root folder is not touched.
# Delete this file and the preview/ folder after the switch.
name: Preview (deshibasket branch)

on:
  push:
    branches: [deshibasket]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Web address (tools/build_seo.py)
        env:
          SITE_URL: https://deshibasket.com/preview
        run: python3 tools/build_seo.py

      - name: Keep search engines out of the preview
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          find site -maxdepth 1 -name '*.html' -exec sed -i 's#<head>#<head><meta name="robots" content="noindex">#' {} +

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to Hostinger preview/ by FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            mirror --reverse --verbose --parallel=2 --exclude-glob .htaccess ./site/ ${FTP_DIR:-.}/preview/;
            bye"
