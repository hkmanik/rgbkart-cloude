# Publishes the site/ folder to the Hostinger subdomain every time main changes.
# Needs three repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   FTP_SERVER    e.g. ftp.hkmanik.com
#   FTP_USERNAME  the FTP account created for public_html/rgbkartdemo
#   FTP_PASSWORD  that account's password
# Optional repository variable FTP_DIR: the folder on the server, relative to the FTP account's
# home. Leave it unset when the FTP account's home IS public_html/rgbkartdemo.
# Optional repository variable SITE_URL: the site's address, e.g. https://www.rgbkart.com (default: the demo subdomain).
# It is put into link previews, robots.txt and sitemap.xml.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'      # every night at 02:30 Dhaka time: refresh the sitemap with new products

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Stamp the version
        run: echo "{\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${GITHUB_SHA}\"}" > site/version.json

      - name: Web address and sitemap (tools/build_seo.py)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 tools/build_seo.py

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to Hostinger by FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            mirror --reverse --verbose --parallel=2 ./site/ ${FTP_DIR:-./};
            bye"
