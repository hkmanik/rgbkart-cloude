<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A shop on RGBKart: products, reviews and contact.">
<meta property="og:site_name" content="RGBKart · Red &amp; Green Basket">
<meta property="og:type" content="website">
<meta property="og:title" content="Shop | RGBKart">
<meta property="og:description" content="A shop on RGBKart: products, reviews and contact.">
<meta property="og:image" content="%%SITE%%/assets/og/rgbkart-share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#00802B">
<link rel="manifest" href="manifest.webmanifest">

<title>Shop | RGBKart</title>
<link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&family=Hind+Siliguri:wght@400;600&display=swap">
<link rel="stylesheet" href="shop.css?v=15">
<style>
  /* Public shop page: banner, logo, name, contact, about, then the shop's products with search, categories and pages */
  main { padding-block: 18px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  #content { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
  .hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .banner { height: 210px; background: radial-gradient(110% 140% at 100% 0%, rgb(245 196 0 / .55), transparent 55%), radial-gradient(90% 140% at 0% 100%, rgb(227 6 19 / .4), transparent 50%), linear-gradient(135deg, #006622, #00802B); }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: end; padding: 0 22px 20px; }
  .slogo { width: 112px; height: 112px; border-radius: 22px; margin-top: -56px; background: #fff; border: 4px solid var(--surface); box-shadow: 0 6px 18px rgb(0 0 0 / .15);
    display: grid; place-items: center; overflow: hidden; font: 700 2.6rem var(--display); color: var(--accent); }
  .slogo img { width: 100%; height: 100%; object-fit: cover; }
  .info h1 { font: 700 1.7rem/1.15 var(--display); margin: 10px 0 4px; overflow-wrap: anywhere; }
  .tagline { color: var(--muted); margin: 0 0 8px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; }
  .fact { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 11px; font-size: .82rem; font-weight: 600; }
  .fact.verified { background: #00802B; color: #fff; }
  .fact.rate { background: #FFF6CC; text-decoration: none; display: inline-flex; } .fact.rate .rt { font-size: .82rem; color: #6B5300; }
  #reviews { scroll-margin-top: calc(var(--head-h, 120px) + 12px); }
  .fact.red { background: #FDE7E8; color: #B3000C; } .fact.yellow { background: #FFF6CC; color: #6B5300; }
  .contact { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .cbtn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font: 700 .9rem var(--body); padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface); }
  .cbtn:hover { background: var(--accent); color: var(--accent-fg); }
  .cbtn.call { background: #E30613; border-color: #E30613; color: #fff; } .cbtn.call:hover { background: #B8000C; }
  .cbtn.wa { background: #1FAF54; border-color: #1FAF54; color: #fff; } .cbtn.wa:hover { background: #178A42; }
  .cwrap { display: grid; gap: 8px; min-width: 0; }
  .social { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .social a { font-size: .85rem; font-weight: 600; text-decoration: none; }
  .holiday { background: #FFF8E1; border: 1px solid #F5C400; border-radius: 12px; padding: 12px 16px; color: #5c4600; font-weight: 600; }
  .about { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .about h2, .prods h2 { font: 600 1.15rem var(--display); margin: 0 0 6px; }
  .about p { margin: 0; white-space: pre-line; color: var(--fg); }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .tools form { display: flex; flex: 1 1 280px; max-width: 420px; }
  .tools input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-right: 0; border-radius: 10px 0 0 10px; background: var(--surface); color: var(--fg); }
  .tools form button { border: 0; background: var(--accent); color: var(--accent-fg); font: 700 .9rem var(--body); padding: 0 16px; border-radius: 0 10px 10px 0; cursor: pointer; }
  .tools select { font: inherit; font-size: .92rem; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .cats button { --c: #00802B; --soft: #E5F4EA; --on: #fff; flex: none; background: var(--soft); border: 1.5px solid var(--c); border-radius: 999px; padding: 6px 14px; color: var(--c); font: 700 .86rem var(--body); cursor: pointer; transition: background-color .15s, color .15s; }
  .cats button:nth-child(3n+2) { --c: #E30613; --soft: #FDE7E8; }
  .cats button:nth-child(3n+3) { --c: #8A6A00; --soft: #FFF6CC; --fill: #F5C400; --on: #2A1A00; }
  .cats button:hover, .cats button[aria-pressed="true"] { background: var(--fill, var(--c)); border-color: var(--fill, var(--c)); color: var(--on); }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1150px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 820px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 10px; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
  @media (max-width: 760px) {
    .banner { height: 130px; }
    .info { grid-template-columns: auto minmax(0, 1fr); padding: 0 16px 16px; gap: 12px; align-items: start; }
    .slogo { width: 84px; height: 84px; margin-top: -42px; border-radius: 18px; font-size: 2rem; }
    .info h1 { font-size: 1.35rem; }
    .cwrap { grid-column: 1 / -1; }
    .contact, .social { justify-content: flex-start; }
  }
</style>
</head>
<body>
<main class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb" style="font-size:.86rem;color:var(--muted);display:flex;gap:6px"><a href="index.html" style="text-decoration:none">Home</a><span>›</span><span id="crumb" translate="no">Shop</span></nav>
  <div id="content"><div class="empty">Loading…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="i18n.js?v=15"></script>
<script src="sync.js?v=1"></script>
<script src="shop.js?v=17"></script>
<script src="reviews.js?v=1"></script>
<script src="report.js?v=1"></script>
<script src="share.js?v=2"></script>
<script src="menu.js?v=5"></script>
<script>
  const PAGE = 20;
  const params = new URLSearchParams(location.search);
  const state = { q: (params.get('q') || '').trim(), cat: params.get('cat') || '', sort: params.get('sort') || 'newest', page: Math.max(1, parseInt(params.get('page'), 10) || 1) };
  let S = null, cats = [], shopCats = [], total = 0;
  const shopImg = path => db.storage.from('shop-assets').getPublicUrl(path).data.publicUrl;
  const intl = n => { const d = (n || '').replace(/[^0-9]/g, ''); return d.startsWith('880') ? d : d.startsWith('0') ? '88' + d : '880' + d; };

  function urlFor(ch) {
    const s = { ...state, ...ch }, p = new URLSearchParams();
    p.set('s', S.shop_slug || S.user_id);
    if (s.q) p.set('q', s.q); if (s.cat) p.set('cat', s.cat); if (s.sort !== 'newest') p.set('sort', s.sort); if (s.page > 1) p.set('page', s.page);
    return 'store.html?' + p.toString();
  }
  function go(ch, push) { Object.assign(state, ch); history[push ? 'pushState' : 'replaceState'](null, '', urlFor({})); drawCats(); loadProducts(); }

  async function start() {
    await initShell();
    const key = params.get('s') || params.get('id') || '';
    let r = await db.from('shops').select('*').eq('shop_slug', key).maybeSingle();
    if (!r.data && /^[0-9a-f-]{36}$/i.test(key)) r = await db.from('shops').select('*').eq('user_id', key).maybeSingle();
    S = r.data;
    const box = $('content'); box.innerHTML = '';
    if (!S) {
      box.append(h('div', { class: 'empty', style: 'display:grid;gap:10px;justify-items:center' }, h('b', { text: 'This shop isn\'t available', style: 'color:var(--fg);font-size:1.1rem' }),
        h('span', { text: 'It may be closed or still waiting for approval.' }), h('a', { href: 'browse.html', text: 'Browse all products' })));
      return;
    }
    const name = L(S, 'shop_name');
    document.title = `${name} | RGBKart`; $('crumb').textContent = name;
    const md = document.head.querySelector('meta[name=description]'); if (md) md.content = `${name}${S.tagline ? ': ' + S.tagline : ''}. Shop on RGBKart, pay in cash on delivery.`;
    const ot = document.head.querySelector('meta[property="og:title"]'); if (ot) ot.content = `${name} on RGBKart`;
    const c = await db.from('categories').select('*').eq('is_active', true);
    cats = c.data || [];
    drawHero();
    loadProducts();
  }

  function drawHero() {
    const box = $('content');
    const name = L(S, 'shop_name');
    const banner = h('div', { class: 'banner' }, S.banner_path && h('img', { src: shopImg(S.banner_path), alt: '' }));
    const logo = h('div', { class: 'slogo', 'aria-hidden': 'true' }, S.logo_path ? h('img', { src: shopImg(S.logo_path), alt: '' }) : (S.shop_name || '?').charAt(0).toUpperCase());
    const where = [S.area, S.city && RGBLang.tr(S.city)].filter(Boolean).join(', ');
    const facts = h('div', { class: 'facts' },
      S.is_verified && h('span', { class: 'fact verified', title: T('RGBKart checked this shop\'s ID or trade licence'), text: T('✓ Verified shop') }),
      S.rating_count > 0 && h('a', { class: 'fact rate', href: '#reviews' }, RGBReviews.line(S)),
      where && h('span', { class: 'fact', text: '📍 ' + where }),
      h('span', { class: 'fact yellow', text: T('On RGBKart since {n}', { n: new Date(S.created_at).getFullYear() }) }),
      h('span', { class: 'fact red', id: 'countFact', hidden: true }),
      S.allow_pickup && h('span', { class: 'fact', text: T('Store pickup available') }));
    const wa = S.whatsapp || S.phone_public;
    const contact = h('div', { class: 'contact' },
      S.phone_public && h('a', { class: 'cbtn call', href: 'tel:+' + intl(S.phone_public), text: T('📞 Call') }),
      wa && h('a', { class: 'cbtn wa', href: `https://wa.me/${intl(wa)}?text=${encodeURIComponent(T('Hi, I found your shop on RGBKart: {u}', { u: location.href }))}`, target: '_blank', rel: 'noopener', text: 'WhatsApp' }),
      S.email_public && h('a', { class: 'cbtn', href: 'mailto:' + S.email_public, text: T('✉ Email') }),
      window.RGBShare && RGBShare.button({ shop: S.shop_slug || S.user_id }, L(S, 'shop_name')));
    const links = [['facebook_url', 'Facebook'], ['instagram_url', 'Instagram'], ['youtube_url', 'YouTube'], ['tiktok_url', 'TikTok'], ['website_url', 'Website']].filter(([k]) => /^https?:\/\//i.test(S[k] || ''));
    box.append(h('section', { class: 'hero' }, banner,
      h('div', { class: 'info' }, logo,
        h('div', { style: 'min-width:0' }, h('h1', { text: name, translate: 'no' }), S.tagline && h('p', { class: 'tagline', text: S.tagline, translate: 'no' }), facts),
        h('div', { class: 'cwrap' }, contact, links.length ? h('div', { class: 'social' }, links.map(([k, t]) => h('a', { href: S[k], target: '_blank', rel: 'noopener', text: t }))) : null))));
    if (S.vacation_mode) box.append(h('div', { class: 'holiday', text: T('This shop is on holiday and not taking orders right now.') + (S.vacation_message ? ' ' + S.vacation_message : '') }));
    if (S.shop_description) box.append(h('section', { class: 'about' }, h('h2', { text: T('About the shop') }), h('p', { text: S.shop_description, translate: 'no' })));
    const search = h('form', { role: 'search', onsubmit: e => { e.preventDefault(); go({ q: e.target.q.value.trim(), page: 1 }, true); } },
      h('input', { name: 'q', type: 'search', placeholder: T('Search this shop'), 'aria-label': T('Search this shop'), value: state.q }), h('button', { type: 'submit', text: T('Search') }));
    const sort = h('select', { 'aria-label': T('Sort by'), onchange: e => go({ sort: e.target.value, page: 1 }) },
      [['newest', 'Newest first'], ['price_asc', 'Price: low to high'], ['price_desc', 'Price: high to low'], ['featured', 'Featured first'], ['rating', 'Top rated']].map(([v, t]) => h('option', { value: v, text: T(t), selected: state.sort === v })));
    box.append(h('section', { class: 'prods' }, h('div', { class: 'tools' }, h('h2', { id: 'prodTitle', text: T('Products'), style: 'margin:0' }), search, sort),
      h('div', { class: 'cats', id: 'cats', hidden: true }), h('div', { class: 'grid', id: 'grid' }),
      h('nav', { class: 'pager', id: 'pager', 'aria-label': T('Pages'), hidden: true }), h('p', { class: 'pager-info', id: 'pagerInfo', hidden: true })));
    // what buyers say about the shop (0029_reviews.sql)
    box.append(h('section', { class: 'about', id: 'reviews' }, h('h2', { text: T('Shop reviews') }), RGBReviews.section(db, { shop: S.user_id })));
    box.append(h('div', { style: 'text-align:center' }, RGBReport.link(db, { shop: S.user_id })));
    // categories this shop sells in (top level)
    db.from('products').select('category_id').eq('seller_id', S.user_id).eq('status', 'approved').limit(1000).then(r => {
      const top = id => { let c = cats.find(x => x.id === id); while (c && c.parent_id) c = cats.find(x => x.id === c.parent_id); return c; };
      const seen = new Map(); (r.data || []).forEach(p => { const t = top(p.category_id); if (t) seen.set(t.id, t); });
      shopCats = [...seen.values()].sort((a, b) => a.sort_order - b.sort_order);
      drawCats();
    });
  }

  function drawCats() {
    const box = $('cats'); if (!box) return;
    box.innerHTML = ''; box.hidden = shopCats.length < 2;
    box.append(h('button', { type: 'button', 'aria-pressed': String(!state.cat), text: T('All'), onclick: () => go({ cat: '', page: 1 }, true) }),
      ...shopCats.map(c => h('button', { type: 'button', 'aria-pressed': String(state.cat === c.slug), text: L(c, 'name'), onclick: () => go({ cat: c.slug, page: 1 }, true) })));
  }

  let token = 0;
  async function loadProducts() {
    const my = ++token, grid = $('grid');
    skeletons(grid, 5); $('pager').hidden = $('pagerInfo').hidden = true;
    let q = db.from('products').select(CARD_FIELDS, { count: 'exact' }).eq('seller_id', S.user_id).eq('status', 'approved');
    if (state.cat) {
      const root = cats.find(c => c.slug === state.cat);
      const ids = []; const walk = id => { ids.push(id); cats.filter(c => c.parent_id === id).forEach(c => walk(c.id)); };
      if (root) { walk(root.id); q = q.in('category_id', ids); }
    }
    if (state.q) { const t = state.q.replace(/[%,()*]/g, ' ').trim(); q = q.or(`title.ilike.%${t}%,title_bn.ilike.%${t}%,description.ilike.%${t}%`); }
    if (state.sort === 'price_asc') q = q.order('price', { ascending: true });
    else if (state.sort === 'price_desc') q = q.order('price', { ascending: false });
    else if (state.sort === 'rating') q = q.order('rating_avg', { ascending: false, nullsFirst: false }).order('rating_count', { ascending: false });
    else if (state.sort === 'featured') q = q.order('is_featured', { ascending: false }).order('published_at', { ascending: false, nullsFirst: false });
    else q = q.order('published_at', { ascending: false, nullsFirst: false });
    const from = (state.page - 1) * PAGE;
    const r = await q.range(from, from + PAGE - 1);
    if (my !== token) return;
    grid.innerHTML = '';
    total = r.count || 0;
    if (!state.q && !state.cat) { const f = $('countFact'); f.hidden = false; f.textContent = T(total === 1 ? '{n} product' : '{n} products', { n: total.toLocaleString('en-IN') }); }
    if (r.error) { grid.append(h('div', { class: 'empty', text: T('Products couldn\'t load. Check your connection and try again.') })); return; }
    if (!r.data.length && total > 0 && state.page > 1) return go({ page: Math.ceil(total / PAGE) });
    if (!r.data.length) { grid.append(h('div', { class: 'empty', text: state.q || state.cat ? T('Try removing a filter or searching for something else.') : T('This shop has no products yet.') })); return; }
    const shops = new Map([[S.user_id, S]]);
    r.data.forEach(p => grid.append(card(p, shops)));
    drawPager();
  }

  function drawPager() {
    const pages = Math.ceil(total / PAGE), cur = Math.min(state.page, Math.max(pages, 1)), nav = $('pager');
    nav.innerHTML = ''; nav.hidden = $('pagerInfo').hidden = pages <= 1;
    if (pages <= 1) return;
    const link = (n, text, cls, label) => { const off = n < 1 || n > pages;
      return h('a', { href: off ? null : urlFor({ page: n }), class: cls, 'aria-disabled': off ? 'true' : null, 'aria-label': label || null, 'aria-current': !cls.includes('step') && n === cur ? 'page' : null, text,
        onclick: e => { e.preventDefault(); if (!off && n !== cur) { go({ page: n }, true); $('prodTitle').scrollIntoView({ behavior: 'smooth' }); } } }); };
    nav.append(link(cur - 1, T('‹ Previous'), 'step', T('Previous page')));
    let last = 0;
    [...new Set([1, pages, cur - 1, cur, cur + 1])].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b).forEach(n => {
      if (n - last > 1) nav.append(h('span', { class: 'gap', text: '…', 'aria-hidden': 'true' }));
      nav.append(link(n, N(n), 'num' + (n === 1 || n === pages ? ' edge' : ''), T('Page {n}', { n }))); last = n; });
    nav.append(link(cur + 1, T('Next ›'), 'step', T('Next page')));
    $('pagerInfo').textContent = T('Showing {a}–{b} of {n} products', { a: (cur - 1) * PAGE + 1, b: Math.min(cur * PAGE, total), n: total.toLocaleString('en-IN') });
  }
  window.addEventListener('popstate', () => { const p = new URLSearchParams(location.search); Object.assign(state, { q: p.get('q') || '', cat: p.get('cat') || '', sort: p.get('sort') || 'newest', page: Math.max(1, parseInt(p.get('page'), 10) || 1) }); drawCats(); loadProducts(); });
  start();
</script>
</body>
</html>
