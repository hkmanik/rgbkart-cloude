# Publishes the site/ folder to the Hostinger subdomain every time main changes.
# Needs three repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER    e.g. ftp.hkmanik.com  (hPanel → Files → FTP Accounts shows it)
#   FTP_USERNAME  the FTP account created for public_html/rgbkartdemo
#   FTP_PASSWORD  that account's password
# Optional repository variable (… → Variables): FTP_DIR, the folder on the server, relative to the
# FTP account's home. Leave it unset when the FTP account's home IS public_html/rgbkartdemo.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Stamp the version
        run: echo "{\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${GITHUB_SHA}\"}" > site/version.json

      - name: Upload to Hostinger by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
                    protocol: ftps
          security: loose
          timeout: 120000
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ${{ vars.FTP_DIR || './' }}
